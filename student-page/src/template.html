<title>Đậu ôn bài · __TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one phone-sized screen at a time, never scrolls. Progress on top, anh Đậu's bubble under it,
   the current card fills the middle, action bar at the bottom. The student moves every step forward
   (swipe or button). Đậu orange is the only loud colour; mint = đúng, coral = sai; the essay paper uses
   the ô ly grid of a Vietnamese school notebook. */
:root {
  --bg: #F3F8F4;
  --paper: #FFFFFF;
  --ink: #2B2420;
  --muted: #7A6E66;
  --line: #E6DDD3;
  --orange: #FF9800;
  --orange-deep: #C65D00;
  --orange-soft: #FFF0DB;
  --mint: #8DD9B8;
  --mint-deep: #1F8A63;
  --mint-soft: #E3F5EC;
  --coral: #D9483B;
  --coral-soft: #FCE6E2;
  --blush-soft: #FDEBE7;
  --chalk: #F4F1E6;
  --grid: rgba(80, 140, 200, .10);
  --grid-strong: rgba(80, 140, 200, .20);
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 18px rgba(60, 40, 20, .07);
  --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-chalk: "Patrick Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1815; --paper: #26211D; --ink: #F3ECE5; --muted: #B4A79C; --line: #3A322C;
    --orange: #FFA42E; --orange-deep: #FFB866; --orange-soft: #3A2A17;
    --mint: #6FC9A2; --mint-deep: #7FD8B1; --mint-soft: #1D3A2E;
    --coral: #FF8373; --coral-soft: #402421; --blush-soft: #3A2622; --chalk: #F4F1E6;
    --grid: rgba(120, 170, 230, .07); --grid-strong: rgba(120, 170, 230, .13);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1815; --paper: #26211D; --ink: #F3ECE5; --muted: #B4A79C; --line: #3A322C;
  --orange: #FFA42E; --orange-deep: #FFB866; --orange-soft: #3A2A17;
  --mint: #6FC9A2; --mint-deep: #7FD8B1; --mint-soft: #1D3A2E;
  --coral: #FF8373; --coral-soft: #402421; --blush-soft: #3A2622; --chalk: #F4F1E6;
  --grid: rgba(120, 170, 230, .07); --grid-strong: rgba(120, 170, 230, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 10px; }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }

/* top bar */
.top { padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 6px; display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.sec { font: 700 15px/1 var(--font-display); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec small { font: 500 12px var(--font-body); color: var(--muted); margin-left: 6px; }
.essay-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.essay-btn img { width: 20px; height: 20px; object-fit: contain; }
.bar { position: relative; height: 12px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--line); }
.bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--orange)); transition: width .6s cubic-bezier(.3, .9, .3, 1); }
.bar-sprout { position: absolute; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -62%); transition: left .6s cubic-bezier(.3, .9, .3, 1); pointer-events: none; }
.bar-sprout img { width: 100%; height: 100%; object-fit: contain; }

/* stage: fixed height, never scrolls */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.scene { position: absolute; inset: 0; padding: 8px 16px 6px; display: flex; flex-direction: column; gap: 10px; --k: 1; }
.scene.in { animation: sceneIn .45s cubic-bezier(.2, .9, .3, 1) both; }
.scene.in.back { animation-name: sceneBack; }
@keyframes sceneIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes sceneBack { from { opacity: 0; transform: translateX(-40px); } }

/* anh Đậu + one speech bubble at a time */
.talk { flex: none; display: flex; gap: 10px; align-items: flex-start; }
.talk[hidden] { display: none; }
.pic { flex: none; width: 76px; height: 76px; object-fit: contain; animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.pic.pop { animation: popIn .5s cubic-bezier(.3, 1.6, .5, 1) both, bob 3.2s ease-in-out .5s infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-1.5deg); } }
@keyframes popIn { from { transform: scale(.4); opacity: 0; } }
.slot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.who { font: 700 11px var(--font-display); color: var(--orange-deep); letter-spacing: .06em; text-transform: uppercase; margin-left: 4px; }
.bubble { background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 9px 14px; font-size: calc(16px * var(--k)); line-height: 1.45; box-shadow: var(--shadow); animation: bubbleIn .4s cubic-bezier(.3, 1.2, .5, 1) both; }
@keyframes bubbleIn { from { opacity: 0; transform: translateX(34px); } }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { opacity: 1; transform: translateY(-3px); } }
/* hero: Đậu bottom-left, his words pop up to the right */
.scene.hero .talk { flex: 1; align-items: flex-end; order: 2; }
.scene.hero .pic { width: 140px; height: 140px; margin-bottom: -4px; }
.scene.hero .slot { align-self: stretch; justify-content: flex-end; padding-bottom: 96px; }
.scene.hero .bubble { border-radius: 18px 18px 18px 4px; transform-origin: 0 100%; animation-name: chatIn; font-size: calc(18px * var(--k)); }
@keyframes chatIn { from { opacity: 0; transform: translate(-16px, 20px) scale(.7); } }
.scene.hero .content { flex: none; order: 1; }

/* the card area */
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .7em; font-size: calc(16px * var(--k)); }
.content > * { flex-shrink: 0; }
.content.overflow { overflow-y: auto; touch-action: pan-y; }
.enter { animation: upIn .5s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes upIn { from { opacity: 0; transform: translateY(36px); } }
.rise { animation: rise .45s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.instant, .instant * { animation-duration: 1ms !important; animation-delay: 0ms !important; transition: none !important; }

/* bottom bar */
.bottom { padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 10px; position: relative; }
.btn { border: 0; border-radius: 16px; padding: 14px 18px; font: 700 17px/1 var(--font-display); cursor: pointer; transition: transform .12s, opacity .2s; }
.btn:active { transform: translateY(2px); }
.btn-main { flex: 1; background: var(--orange); color: #3A1D00; box-shadow: 0 4px 0 var(--orange-deep); }
.btn-main.wait { opacity: .4; box-shadow: none; }
.btn-back { width: 52px; background: var(--paper); border: 1.5px solid var(--line); color: var(--muted); font-size: 22px; padding: 0; }
.btn-back:disabled { visibility: hidden; }
.btn-ghost { background: var(--paper); border: 1.5px solid var(--line); color: var(--ink); box-shadow: 0 3px 0 var(--line); font-size: .95em; padding: .75em 1em; }

/* swipe hint */
.app.hinting .scene { padding-bottom: 48px; }
.hint { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; pointer-events: none; animation: rise .5s both; }
.hint svg { width: 46px; height: 24px; overflow: visible; }
.hint .finger { animation: swipe 1.8s cubic-bezier(.5, 0, .3, 1) infinite; }
@keyframes swipe { 0% { transform: translateX(14px); opacity: 0; } 15% { opacity: 1; } 70% { transform: translateX(-14px); opacity: 1; } 100% { transform: translateX(-14px); opacity: 0; } }

/* generic pieces */
.card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; padding: .9em 1em; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; border-radius: 999px; padding: .15em .7em; font: 700 .8em/1.5 var(--font-display); letter-spacing: .02em; }
.tone-orange { background: var(--orange-soft); color: var(--orange-deep); }
.tone-mint { background: var(--mint-soft); color: var(--mint-deep); }
.tone-blush { background: var(--blush-soft); color: var(--coral); }
.h { font: 800 1.6em/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.h2 { font: 700 1.2em/1.25 var(--font-display); margin: 0; text-wrap: balance; }
.label { font: 700 .72em var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88em; }
.en { font-style: italic; }
.quote { font-size: .95em; line-height: 1.6; }
.quote::before, .quote::after { font: 800 1.4em/0 var(--font-display); color: var(--orange); vertical-align: -.3em; }
.quote::before { content: "“"; margin-right: 2px; } .quote::after { content: "”"; margin-left: 1px; }
.cite { display: inline-flex; align-self: flex-start; align-items: center; gap: 5px; border: 0; background: none; color: var(--orange-deep); font: 600 .82em var(--font-body); padding: 2px 0; cursor: pointer; }
.cite svg { width: 14px; height: 14px; }
.stack { display: flex; flex-direction: column; gap: .6em; }
.row { display: flex; gap: .6em; align-items: center; }
.icon { width: 1.6em; height: 1.6em; object-fit: contain; flex: none; }

/* choices */
.choices { display: flex; flex-direction: column; gap: .55em; }
.choice { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 16px; padding: .7em 1em; font-weight: 600; font-size: 1em; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: border-color .2s, background .2s; }
.choice:active { transform: translateY(2px); box-shadow: none; }
.choice.right { border-color: var(--mint-deep); background: var(--mint-soft); box-shadow: 0 3px 0 var(--mint); }
.choice.wrong { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 3px 0 var(--coral); animation: shake .4s; }
.choice:disabled { cursor: default; }
.choice.en { font-style: italic; font-weight: 500; }
.nudge { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* results */
.big-num { font: 800 3.4em/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--orange-deep); }
.big-num small { font: 600 .32em var(--font-body); color: var(--muted); margin-left: 6px; }
.meter { position: relative; height: 12px; border-radius: 999px; background: var(--bg); border: 1.5px solid var(--line); margin-top: 1.2em; }
.meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: var(--mint); transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
.meter-mark { position: absolute; top: -18px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }
.meter-mark span { position: absolute; top: -3px; left: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; perspective: 600px; }
.score { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: .5em .2em .45em; text-align: center; animation: flip .5s cubic-bezier(.2, .9, .3, 1) both; box-shadow: var(--shadow); }
.score b { display: block; font: 800 1.8em/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.score span { display: block; font: 700 .72em var(--font-display); color: var(--muted); letter-spacing: .06em; }
.score em { display: block; font-style: normal; font-size: .66em; color: var(--muted); }
@keyframes flip { from { transform: rotateY(90deg); opacity: 0; } }
.overall { display: flex; align-items: center; gap: 1em; }
.ring { width: 2.4em; height: 2.4em; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #3A1D00; font: 800 1.9em/1 var(--font-display); font-variant-numeric: tabular-nums; box-shadow: 0 0 0 5px var(--orange-soft); animation: popIn .6s cubic-bezier(.3, 1.6, .5, 1) both; }

/* framework */
.fw-card { display: flex; flex-direction: column; gap: .6em; }
.summary { font-weight: 600; }
.idea-chip { display: flex; gap: .7em; align-items: baseline; padding: .5em .8em; border-radius: 12px; background: var(--bg); animation: popIn .45s cubic-bezier(.3, 1.5, .5, 1) both; }
.idea-chip b { font: 700 .72em var(--font-display); letter-spacing: .05em; color: var(--muted); white-space: nowrap; text-transform: uppercase; }
.map { display: grid; grid-template-columns: auto 1fr 1fr; gap: .5em; align-items: center; }
.map .lab { display: flex; align-items: center; gap: .45em; font: 700 .9em var(--font-display); white-space: nowrap; animation: rise .4s both; }
.map .wide { grid-column: 2 / 4; font-size: .85em; color: var(--muted); animation: rise .4s both; }
.map .chip { font-size: .85em; font-weight: 600; text-align: center; padding: .45em .5em; border-radius: 12px; line-height: 1.3; animation: popIn .4s cubic-bezier(.3, 1.5, .5, 1) both; }
.map .c { background: var(--mint-soft); color: var(--mint-deep); }
.map .s { background: var(--blush-soft); color: var(--coral); }
.map .down { text-align: center; color: var(--orange); font-weight: 800; line-height: 1; animation: rise .4s both; }
.tick { width: 1.5em; height: 1.5em; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--mint-soft); }
.tick.no { background: var(--coral-soft); }
.tick svg { width: 62%; height: 62%; stroke: var(--mint-deep); stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .15s forwards; }
.tick.no svg { stroke: var(--coral); }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* idea chains */
.chain { display: flex; flex-direction: column; align-items: stretch; }
.node { padding: .45em .85em; border-radius: 12px; background: var(--mint-soft); font-weight: 600; font-size: .92em; animation: popIn .45s cubic-bezier(.3, 1.5, .5, 1) both; }
.node.bad { background: var(--coral-soft); color: var(--coral); font-style: italic; }
.node.new { background: transparent; border: 2px dashed var(--mint-deep); color: var(--mint-deep); }
.arrow { align-self: center; width: 2px; height: .75em; background: var(--muted); opacity: .45; position: relative; animation: rise .3s both; }
.arrow::after { content: ""; position: absolute; left: -4px; bottom: -2px; border: 5px solid transparent; border-top-color: var(--muted); border-bottom: 0; }
.gap-mark { align-self: center; font: 700 .8em var(--font-display); color: var(--coral); padding: .3em .8em; border-radius: 999px; background: var(--coral-soft); margin-top: .3em; animation: popIn .4s both; }
.flow-en { font-size: .8em; color: var(--muted); line-height: 1.5; }
.ov { display: flex; gap: .75em; align-items: center; padding: .7em .9em; animation: rise .45s both; }
.ov .t { flex: 1; min-width: 0; }
.ov .t b { display: block; font-size: .95em; }
.ov .t span { font-size: .82em; color: var(--muted); }

.ov.tap { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; border-color: var(--coral); }
.ov.tap:active { transform: translateY(2px); }
.chev { flex: none; font: 800 1.5em/1 var(--font-display); color: var(--coral); }
.ov.tap .go { color: var(--coral); font-weight: 600; }
button.mcard { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.mcard.main { border: 2px solid var(--orange); background: var(--orange-soft); padding: .9em 1em; }
.mcard.main .n { background: var(--orange); color: #3A1D00; }
.mcard.main .t b { font: 800 1.15em/1.25 var(--font-display); }
.mcard.minor { opacity: .5; box-shadow: none; padding: .45em .8em; font-size: .88em; }
.mcard.minor .n { width: 2.2em; height: 2.2em; }
.num { width: 1.9em; height: 1.9em; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange-deep); font: 800 1em var(--font-display); }
.quote-card { text-align: center; padding: 1.3em 1.2em; display: flex; flex-direction: column; gap: .6em; align-items: center; }
.quote-card .qt { font: 700 1.2em/1.45 var(--font-display); font-style: italic; text-wrap: balance; }
.quote-card .qs { font: 700 .75em var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--orange-deep); }
.quote-card .qm { font-size: .9em; color: var(--muted); }
.quote-card .qt::before { content: "“"; color: var(--orange); } .quote-card .qt::after { content: "”"; color: var(--orange); }

/* linking */
.lg-label { font: 700 .72em var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: .35em; }
.chips { display: flex; flex-wrap: wrap; gap: .45em; }
.lchip { border: 0; border-radius: 10px; padding: .35em .7em; background: var(--orange-soft); color: var(--orange-deep); font-weight: 600; font-size: .88em; font-style: italic; cursor: pointer; animation: popIn .4s cubic-bezier(.3, 1.5, .5, 1) both; }
.swap { display: flex; flex-direction: column; gap: .35em; }
.swap .from { color: var(--coral); text-decoration: line-through; text-decoration-thickness: 2px; font-style: italic; }
.swap .to { color: var(--mint-deep); font-weight: 600; font-style: italic; }

/* corrections inside sentences */
.err { text-decoration: underline wavy var(--coral); text-decoration-thickness: 1.5px; text-underline-offset: 4px; font-weight: 600; }
.err.gap { display: inline-block; min-width: 18px; height: 1.1em; vertical-align: -2px; border-bottom: 2.5px dashed var(--coral); }
.corr s { color: var(--coral); text-decoration-thickness: 2px; }
.corr ins { text-decoration: none; background: var(--mint-soft); color: var(--mint-deep); font-weight: 600; border-radius: 4px; padding: 0 2px; }
.corr.live s { background: linear-gradient(var(--coral), var(--coral)) no-repeat 0 55% / 0 2px; text-decoration: none; animation: strike .45s forwards; }
.corr.live ins { display: inline-block; animation: popIn .4s .4s cubic-bezier(.3, 1.5, .5, 1) both; }
@keyframes strike { to { background-size: 100% 2px; } }
.snip { display: flex; gap: .6em; align-items: flex-start; padding: .55em .8em; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.snip .quote { flex: 1; min-width: 0; }
.snip .pin { flex: none; width: 16px; height: 16px; color: var(--orange-deep); margin-top: .25em; }
.times { display: flex; align-items: center; gap: .8em; }
.times .n { font: 800 2.8em/1 var(--font-display); color: var(--coral); font-variant-numeric: tabular-nums; }
.times .l { font-weight: 600; }
.mcard { display: flex; gap: .8em; align-items: center; padding: .7em .9em; animation: rise .45s both; }
.mcard .n { width: 2.6em; height: 2.6em; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--coral-soft); color: var(--coral); font: 800 1.1em var(--font-display); }
.mcard .t { flex: 1; min-width: 0; }
.mcard .t b { display: block; }

/* chalkboard */
.board-wrap { position: relative; container-type: inline-size; width: calc(72% * var(--k)); max-width: 300px; align-self: center; flex: none; }
.board-wrap img { width: 100%; display: block; }
.board-text { position: absolute; left: 59%; top: 33.5%; width: 33%; height: 13.5%; display: flex; flex-direction: column; justify-content: center; align-items: center; font: 400 5.2cqw/1.05 var(--font-chalk); color: var(--chalk); text-align: center; white-space: nowrap; }
.board-text.one { font-size: 7.5cqw; }
.board-text span { opacity: 0; animation: chalk .5s forwards; }
@keyframes chalk { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .55em; }
.rules li { display: flex; gap: .6em; font-size: .95em; animation: rise .45s both; }

/* practice */
.tap-sent { display: flex; flex-wrap: wrap; gap: .4em .25em; font-size: 1.1em; line-height: 1.35; }
.tok { border: 0; background: var(--paper); border-bottom: 2px solid var(--line); border-radius: 8px; padding: .3em .45em; cursor: pointer; font-style: italic; }

.tok.wrong { background: var(--coral-soft); border-color: var(--coral); animation: shake .4s; }

/* finish */

.stars img.off { filter: grayscale(1); opacity: .25; }

/* sheets (essay, other mistakes) */
.sheet-back { position: fixed; inset: 0; background: rgba(30, 20, 10, .35); z-index: 20; animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; height: 88%; background: var(--paper); border-radius: 24px 24px 0 0; z-index: 21; display: flex; flex-direction: column; animation: sheetUp .35s cubic-bezier(.2, .9, .3, 1) both; box-shadow: 0 -10px 40px rgba(0, 0, 0, .18); }
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet-head { padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1.5px solid var(--line); }

.sheet-body { flex: 1; overflow-y: auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 28px); font-size: 16px;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px, 32px 32px, 8px 8px, 8px 8px; }
.prompt { font-size: 14px; background: var(--bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
.essay p { margin: 0 0 16px; line-height: 1.85; }

/* short phones (iPhone SE and similar) */

}

@media (prefers-reduced-motion: reduce) {

}

<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <div class="sec" id="sec"></div>
      <button class="essay-btn" id="essayBtn" type="button"><img alt="" id="essayIcon">Bài của em</button>

    </div>

  <footer class="bottom" id="bottom">
    <button class="btn btn-back" id="backBtn" type="button" aria-label="Quay lại">‹</button>

  </footer>
</div>

<script type="application/json" id="lesson-data">__LESSON_JSON__</script>
<script type="application/json" id="asset-data">__ASSETS_JSON__</script>
<script>
(() => {
"use strict";
const L = JSON.parse(document.getElementById("lesson-data").textContent);
const A = JSON.parse(document.getElementById("asset-data").textContent);
const NAME = L.student;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);
const lower1 = t => t.charAt(0).toLowerCase() + t.slice(1);

/* ---------- essay index ---------- */
const SENT = {};
L.essay.paragraphs.forEach(p => p.sentences.forEach(s => { SENT[s.id] = s; }));
const C = L.corrections;
const CID_SENT = {};
Object.values(SENT).forEach(s => s.segs.forEach(g => { if (typeof g !== "string") CID_SENT[g.c] = s.id; }));
const origText = sid => SENT[sid].segs.map(g => typeof g === "string" ? g : C[g.c].orig).join("").replace(/\s+/g, " ").trim();

/* ---------- DOM helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const img = (key, cls = "", alt = "") => h("img", { src: A[key], class: cls, alt });
const CITE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const cite = (sid, cids) => h("button", { class: "cite", type: "button", html: CITE_SVG, onclick: () => openEssay({ sid, cids }) }, "Xem trong bài");
const TICK = ok => h("span", { class: "tick" + (ok ? "" : " no"), html: ok ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>' });

/* sentence renderer: "orig" marks focused errors, "diff" shows strike + fix; window trims to N words around them */
function sentence(sid, { mode = "orig", focus = null, live = false, window: win = 0 } = {}) {
  const wrap = h("span", { class: "s", "data-sid": sid });
  for (const g of SENT[sid].segs) {
    if (typeof g === "string") { wrap.append(g); continue; }
    const c = C[g.c];
    const on = !focus || focus.includes(g.c);
    if (mode === "orig") {
      if (on && focus) wrap.append(c.orig ? h("span", { class: "err" }, c.orig.trimEnd()) : h("span", { class: "err gap", "aria-label": "chỗ thiếu" }), c.orig.endsWith(" ") ? " " : "");
      else wrap.append(c.orig);
    } else {
      if (!on) { wrap.append(c.orig); continue; }
      const orig = c.orig.trim(), fix = c.fix.trim();
      const lead = /^\s/.test(c.orig || c.fix) ? " " : "", tail = /\s$/.test(c.orig) || /\s$/.test(c.fix) ? " " : "";
      wrap.append(lead, h("span", { class: "corr" + (live ? " live" : ""), "data-c": g.c }, orig ? h("s", {}, orig) : null, orig && fix ? " " : null, fix ? h("ins", {}, fix) : null), tail);
    }
  }
  wrap.normalize();
  if (win && focus) {
    const kids = [...wrap.childNodes];
    const marks = kids.map((n, i) => n.nodeType === 1 ? i : -1).filter(i => i >= 0);
    if (marks.length) {
      const a = marks[0], b = marks[marks.length - 1];
      const first = kids[a - 1], last = kids[b + 1];
      if (first && first.nodeType === 3) { const w = first.data.split(" "); if (w.length > win + 1) first.data = "… " + w.slice(-win - 1).join(" "); }
      if (last && last.nodeType === 3) { const w = last.data.split(" "); if (w.length > win + 1) last.data = w.slice(0, win + 1).join(" ") + " …"; }
    }
  }
  return wrap;
}

/* ---------- confetti ---------- */
function confetti() {
  if (REDUCED || replay) return;
  const cv = h("canvas", { class: "confetti" }); document.body.append(cv);
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ["#FF9800", "#8DD9B8", "#F9B8AE", "#FFD166", "#6FB7F2"];
  const ps = Array.from({ length: 90 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .45, vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, hh: 4 + Math.random() * 5, c: cols[Math.random() * cols.length | 0] }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.hh / 2, p.w, p.hh); ctx.restore(); }
    if (++t < 150) requestAnimationFrame(frame); else cv.remove();
  })();
}

/* ---------- saved progress (this browser only) ---------- */
const KEY = "dau:" + L.homework + ":" + NAME;
const fresh = () => ({ screen: 0, passed: 0, answers: {}, practice: {}, beats: {}, draft: "", swiped: false });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = { ...S, ...JSON.parse(raw) }; } catch (e) { /* storage unavailable */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } };

/* =====================================================================
   Engine. A screen is a script of beats. Each gate() waits for the student
   (swipe or Tiếp); nothing moves forward on its own. Going back re-runs the
   screen instantly up to the previous gate.
   ===================================================================== */
let runId = 0, cur = 0, passed = 0, target = 0, replay = false, fast = false;
let waiting = null, needAnswer = null, atEnd = false, resumed = false;
let scene, talk, pic, slot, content;
const pending = new Set();

const wait = ms => new Promise(r => {
  if (replay || fast || REDUCED) return r();
  const p = { r, t: setTimeout(() => { pending.delete(p); r(); }, ms) };
  pending.add(p);
});
function hurry() { fast = true; for (const p of pending) { clearTimeout(p.t); p.r(); } pending.clear(); }
function alive(id) { if (id !== runId) throw new Error("stale"); }

async function tick(el, to, step, decimals, ms, id) {
  for (let v = step; v < to - 1e-9; v += step) { el.textContent = v.toFixed(decimals); await wait(ms); alive(id); }
  el.textContent = to.toFixed(decimals);
}

function fit() {
  if (!content) return;
  content.classList.remove("overflow");
  let k = 1;
  scene.style.setProperty("--k", k);
  // layout heights only: entrance animations use transforms, which would inflate scrollHeight
  const over = () => {
    let bottom = 0;
    for (const ch of content.children) bottom = Math.max(bottom, ch.offsetTop + ch.offsetHeight);
    return bottom - content.offsetTop > content.clientHeight + 1;
  };
  while (over() && k > .74) { k = +(k - .04).toFixed(2); scene.style.setProperty("--k", k); }
  if (over()) content.classList.add("overflow");
}

/* re-fit whenever the screen's content or Đậu's bubble changes, once per frame */
let fitQueued = false;
function settle() { if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fit(); }); }
const fitRO = new ResizeObserver(settle), fitMO = new MutationObserver(settle);
if (document.fonts) document.fonts.ready.then(settle);

function makeCtx(id) {
  const ctx = {
    id,
    pose(p) { const src = A["dau_" + p]; if (pic.getAttribute("src") !== src) { pic.src = src; pic.classList.remove("pop"); void pic.offsetWidth; pic.classList.add("pop"); } },
    async say(text, pose) {
      alive(id);
      talk.hidden = false;
      if (pose) ctx.pose(pose);
      const b = h("div", { class: "bubble" });
      const who = slot.querySelector(".who") || h("div", { class: "who" }, "anh Đậu");
      if (!replay && !fast && !REDUCED) b.append(h("span", { class: "typing", "aria-hidden": "true" }, h("i"), h("i"), h("i")));
      slot.replaceChildren(who, b); fit();
      await wait(Math.min(900, 350 + text.length * 8));
      b.textContent = text; fit();
      alive(id);
    },
    show(el, { replace = false } = {}) {
      alive(id);
      el.classList.add(replace ? "enter" : "rise");
      if (replace) content.replaceChildren(el); else content.append(el);
      fit();
      el.querySelectorAll("img").forEach(i => { if (!i.complete) i.addEventListener("load", fit, { once: true }); });
      return el;
    },
    wait: async ms => { await wait(ms); alive(id); },
    async gate() {
      alive(id);
      if (passed < target) { passed++; return; }
      replay = false; scene.classList.remove("instant"); fast = false;
      setBtn(); settle();
      await new Promise(r => { waiting = r; });
      alive(id);
      passed++; fast = false;
      if (!screens[cur].noSave) { S.screen = cur; S.passed = passed; save(); }
      progress(); setBtn();
    },
    ask(options, { answer = null, key, en = false }) {
      alive(id);
      const box = h("div", { class: "choices" });
      const btns = options.map(o => h("button", { class: "choice" + (en ? " en" : ""), type: "button" }, o));
      box.append(...btns);
      ctx.show(box);
      return new Promise(resolve => {
        const pick = i => {
          btns.forEach(b => { b.disabled = true; });
          btns[i].classList.add(answer == null || i === answer ? "right" : "wrong");
          if (answer != null && i !== answer) btns[answer].classList.add("right");
          S.answers[key] = i; save();
          needAnswer = null; setBtn();
          resolve(i);
        };
        btns.forEach((b, i) => b.addEventListener("click", () => pick(i)));
        if (S.answers[key] != null && replay) pick(S.answers[key]);
        else { needAnswer = box; setBtn(); settle(); }
      });
    },
  };
  return ctx;
}

const screens = [];
const SECTIONS = ["Kết quả", "Framework", "Phát triển ý", "Linking", "Ngữ pháp & Từ vựng", "Luyện tập", "Tổng kết"];
const add = (sec, script, opts = {}) => screens.push({ sec, script, ...opts });

async function run(i, tgt = 0, dir = 1) {
  runId++; const id = runId;
  for (const p of pending) clearTimeout(p.t);
  pending.clear();
  cur = i; passed = 0; target = tgt; atEnd = false; waiting = null; needAnswer = null; fast = false;
  replay = dir < 0 || tgt > 0;
  const sc = screens[i];
  pic = h("img", { class: "pic pop", alt: "anh Đậu", src: A.dau_waving });
  slot = h("div", { class: "slot" });
  talk = h("div", { class: "talk" }, pic, slot); talk.hidden = true;
  content = h("div", { class: "content" });
  scene = h("div", { class: "scene" + (sc.hero ? " hero" : "") + (replay ? " instant" : " in") }, talk, content);
  $("#stage").replaceChildren(scene);
  fitRO.disconnect(); fitMO.disconnect();
  fitRO.observe(scene); fitMO.observe(scene, { childList: true, subtree: true, characterData: true });
  $("#sec").replaceChildren(SECTIONS[sc.sec], h("small", {}, `${sc.sec + 1}/${SECTIONS.length}`));
  progress(); setBtn(); hint();
  try { await sc.script(makeCtx(id)); }
  catch (e) { if (e.message === "stale") return; console.error(e); }
  if (id !== runId) return;
  replay = false; scene.classList.remove("instant");
  atEnd = true; S.beats[i] = passed; settle();
  if (!sc.noSave) { S.screen = i; S.passed = passed; }
  save(); progress(); setBtn();
}

/* optional screens (extra mistakes, the "later" goodbye) are only reached by tapping into them */
function visible(i, from) {
  const sc = screens[i];
  if (sc.skip && sc.skip()) return false;
  return !sc.optional || screens[from].group === sc.group;
}
function nextIndex(from, dir) { let j = from + dir; while (j >= 0 && j < screens.length && !visible(j, from)) j += dir; return j; }
function jump(i) { if (document.querySelector(".sheet")) return; resumed = true; run(i); }

function forward() {
  if (document.querySelector(".sheet")) return;
  if (needAnswer) { needAnswer.classList.remove("nudge"); void needAnswer.offsetWidth; needAnswer.classList.add("nudge"); return; }
  if (waiting) { const w = waiting; waiting = null; w(); return; }
  if (!atEnd) { hurry(); return; }                 // still animating: finish it, never skip ahead
  if (cur === 0 && S.screen > 1 && !resumed) { resumed = true; return run(S.screen, S.passed); }
  resumed = true;
  const j = nextIndex(cur, 1);
  if (j < screens.length) run(j); else openEssay({});
}
function backward() {
  if (document.querySelector(".sheet")) return;
  if (passed > 0) return run(cur, passed - 1, -1);
  const j = nextIndex(cur, -1);
  if (j >= 0) run(j, S.beats[j] != null ? S.beats[j] : 999, -1);
}

function setBtn() {
  const b = $("#nextBtn"), sc = screens[cur];
  b.classList.toggle("wait", !!needAnswer);
  let t = "Tiếp";
  if (needAnswer) t = "Chọn đáp án nha";
  else if (atEnd && cur === 0 && S.screen > 1 && !resumed) t = "Làm tiếp bài dở";
  else if (atEnd && sc.last) t = "Xong";
  else if (atEnd && sc.label) t = sc.label;
  b.textContent = t;
  $("#backBtn").disabled = cur === 0 && passed === 0;
}
function progress() {
  const beats = S.beats[cur] || 4;
  const pct = Math.min(100, (cur + Math.min(1, passed / Math.max(1, beats))) / (screens.length - 1) * 100);
  $("#barFill").style.width = pct + "%";
  $("#barSprout").style.left = `clamp(10px, ${pct}%, calc(100% - 10px))`;
  $("#bar").setAttribute("aria-valuenow", Math.round(pct));
}

/* swipe hint until the first swipe */
function hint() {
  const old = $(".hint"); if (old) old.remove();
  $("#app").classList.toggle("hinting", !S.swiped && cur <= 3);
  if (S.swiped || cur > 3) return;

/* gestures: finger left or up = next, right or down = back */
(() => {
  const st = $("#stage"); let sx = 0, sy = 0, on = false;
  st.addEventListener("pointerdown", e => {
    if (e.target.closest(".wchip, textarea, input, label")) return;
    on = true; sx = e.clientX; sy = e.clientY;
  });
  st.addEventListener("pointerup", e => {
    if (!on) return; on = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 45) return;
    const fwd = Math.abs(dx) > Math.abs(dy) ? dx < 0 : dy < 0;
    if (!S.swiped) { S.swiped = true; save(); const hn = $(".hint"); if (hn) hn.remove(); $("#app").classList.remove("hinting"); fit(); }
    if (fwd) forward(); else backward();
  });
  st.addEventListener("pointercancel", () => { on = false; });
})();
$("#nextBtn").addEventListener("click", forward);
$("#backBtn").addEventListener("click", backward);
document.addEventListener("keydown", e => {
  if ((e.target.closest && e.target.closest("textarea, input")) || document.querySelector(".sheet")) return;
  if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); forward(); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); backward(); }
});

/* one exercise; resolves when solved (or revealed after 2 tries) */
let rightCount = 0;
const RIGHT = ["Chuẩn rồi á em", `Đúng rồi nè ${NAME}`, "Chính xác", "Đúng rồi, em nắm được rồi đó"];
function exercise(c, item, key, counter) {
  const rec = S.practice[key] || (S.practice[key] = { tries: 0, done: false, first: null });
  const body = h("div", { class: "stack" });
  c.show(h("div", { class: "stack" }, h("div", { class: "row" }, h("span", { class: "pill tone-orange" }, kind(item)), counter ? h("span", { class: "small muted" }, counter) : null), body), { replace: true });
  if (!rec.done) c.say(item.type === "build" ? "Dịch câu này sang tiếng Anh nha" : item.q, "magnify");
  return new Promise(resolve => {
    let finished = false, reveal = () => {};
    const lock = () => body.querySelectorAll(".tok, .wchip, .choice").forEach(b => { b.disabled = true; });
    const end = ok => { finished = true; rec.done = true; save(); lock(); needAnswer = null; setBtn(); resolve(ok); };
    async function result(ok) {
      if (finished) return;
      rec.tries++; if (rec.first == null) rec.first = ok; save();
      if (ok) { end(true); await c.say(rec.tries > 1 ? RIGHT[rightCount++ % RIGHT.length] : RIGHT[rightCount++ % RIGHT.length] + ", " + lower1(item.explain), "thumbsup"); }
      else if (rec.tries < 2) await c.say(`Chưa đúng nè ${NAME}, ${lower1(item.explain)}, em thử lại nhen`, "oops");
      else { reveal(); end(false); await c.say("Đáp án ở đây nè, câu này mình ôn lại cuối bài nha", "thinking"); }
    }
    if (item.type === "choose") {
      if (item.sentence) body.append(h("div", { class: "card quote en" }, item.sentence));
      const btns = item.options.map((o, i) => h("button", { class: "choice" + (item.sentence ? "" : " en"), type: "button", onclick: () => {
        if (finished) return;
        btns.forEach(b => b.classList.remove("wrong"));
        if (i === item.answer) { btns[i].classList.add("right"); result(true); }
        else { btns[i].classList.add("wrong"); btns[i].disabled = true; result(false); }
      } }, o));
      reveal = () => btns[item.answer].classList.add("right");
      const box = h("div", { class: "choices" }, btns); body.append(box); needAnswer = box;
    } else if (item.type === "tap") {
      const words = item.sentence.split(" ");
      const target = words.findIndex(w => w.replace(/[.,!?]/g, "") === item.wrong);
      const toks = words.map((w, i) => h("button", { class: "tok", type: "button", onclick: () => {
        if (finished) return;
        toks.forEach(t => t.classList.remove("wrong"));
        if (i === target) { fixTok(); result(true); } else { toks[i].classList.add("wrong"); result(false); }
      } }, w));
      function fixTok() { const t = toks[target]; t.classList.add("right"); t.replaceChildren(h("s", {}, item.wrong), h("ins", {}, item.fix + words[target].replace(/[^.,!?]/g, ""))); }
      reveal = fixTok;
      body.append(h("div", { class: "small muted" }, "Chạm vào chữ sai"));
      const box = h("div", { class: "card tap-sent" }, toks); body.append(box); needAnswer = box;
    } else if (item.type === "build") {
      body.append(h("div", { class: "vi" }, item.vi));
      const b = builder(item, () => finished);
      const check = h("button", { class: "btn btn-ghost", type: "button", onclick: () => {
        if (finished) return;
        const words = b.picked();
        if (!words.length) return;
        const ok = words.join(" ") === item.answer.join(" ");
        b.line.classList.remove("bad"); void b.line.offsetWidth; b.line.classList.add(ok ? "ok" : "bad");
        if (ok || rec.tries >= 1) check.remove();
        result(ok);
      } }, "Kiểm tra");
      reveal = () => { check.remove(); b.showAnswer(); };
      body.append(b.el, check); needAnswer = b.el;
    }
    fit(); setBtn(); settle();
    if (rec.done) { reveal(); end(rec.first); c.say(rec.first ? RIGHT[0] : "Đáp án ở đây nè", rec.first ? "thumbsup" : "thinking"); }
  });
}

/* sentence builder: tap to add or remove a word, drag it to put it anywhere */
function builder(item, isDone) {
  const words = [...item.answer, ...item.extra];
  const order = words.map((_, i) => i).sort((a, b) => ((a * 7919 + words.length * 31) % 97) - ((b * 7919 + words.length * 31) % 97));
  const line = h("div", { class: "build-line", "aria-label": "Câu của em" });
  const pool = h("div", { class: "pool" });
  const chips = order.map((i, rank) => { const ch = h("button", { class: "wchip", type: "button", "data-i": i }, words[i]); ch.rank = rank; return ch; });
  pool.append(...chips);
  const toPool = ch => { const after = [...pool.children].find(x => x.rank > ch.rank); pool.insertBefore(ch, after || null); };
  const toggle = ch => { if (ch.parentNode === pool) line.append(ch); else toPool(ch); line.classList.remove("bad", "ok"); fit(); };
  let drag = null;
  const before = (x, y) => {
    const kids = [...line.children].filter(n => n.classList.contains("wchip") && n !== drag.ch);
    for (const kid of kids) { const r = kid.getBoundingClientRect(); if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) return kid; }
    return null;
  };
  const overLine = (x, y) => { const r = line.getBoundingClientRect(); return x > r.left - 20 && x < r.right + 20 && y > r.top - 30 && y < r.bottom + 30; };
  chips.forEach(ch => {
    ch.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !isDone()) { e.preventDefault(); toggle(ch); } });
    ch.addEventListener("pointerdown", e => {
      if (isDone()) return;
      e.preventDefault(); ch.setPointerCapture(e.pointerId);
      drag = { ch, x: e.clientX, y: e.clientY, moved: false, ghost: null, ph: h("span", { class: "ph" }) };
    });
    ch.addEventListener("pointermove", e => {
      if (!drag || drag.ch !== ch) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      if (!drag.moved) { drag.moved = true; drag.ghost = h("div", { class: "wchip ghost" }, ch.textContent); document.body.append(drag.ghost); ch.classList.add("dragging"); }
      drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
      if (overLine(e.clientX, e.clientY)) line.insertBefore(drag.ph, before(e.clientX, e.clientY)); else drag.ph.remove();
    });
    const finish = () => {
      if (!drag || drag.ch !== ch) return;
      const d = drag; drag = null;
      if (!d.moved) return toggle(ch);
      ch.classList.remove("dragging"); d.ghost.remove();
      if (d.ph.parentNode) { line.insertBefore(ch, d.ph); d.ph.remove(); } else toPool(ch);
      line.classList.remove("bad", "ok"); fit();
    };
    ch.addEventListener("pointerup", finish);
    ch.addEventListener("pointercancel", finish);
  });
  return {
    el: h("div", { class: "stack" }, line, pool), line,
    picked: () => [...line.querySelectorAll(".wchip")].map(x => words[+x.dataset.i]),
    showAnswer: () => { line.replaceChildren(...item.answer.map(w => h("span", { class: "wchip" }, w))); line.classList.remove("bad"); line.classList.add("ok"); pool.remove(); fit(); },
  };
}

/* ---------- sheets ---------- */
function sheet(title, head, body) {
  const back = h("div", { class: "sheet-back" });
  const el = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("div", { class: "sheet-head" }, h("div", { class: "grab" }),
      h("div", { class: "sheet-title" }, h("div", { class: "h2" }, title), h("button", { class: "x", type: "button", "aria-label": "Đóng" }, "×")), head),
    body);
  const close = () => { back.remove(); el.remove(); document.removeEventListener("keydown", esc); $("#essayBtn").focus(); };
  const esc = e => { if (e.key === "Escape") close(); };
  back.addEventListener("click", close); el.querySelector(".x").addEventListener("click", close);
  document.addEventListener("keydown", esc);
  document.body.append(back, el);
  el.querySelector(".x").focus();
  return el;
}
function openOthers() {
  const body = h("div", { class: "sheet-body" });
  L.mistakes.others.forEach(o => body.append(h("div", { class: "other-row" }, h("div", { style: "font-weight:600" }, `${o.label} · ${o.cids.length}`),
    ...o.cids.map(x => h("div", { class: "ex en" }, (C[x].orig.trim() || "…") + "  →  " + (C[x].fix.trim() || "bỏ"))))));
  sheet("Các lỗi nhỏ khác", null, body);
}
function openEssay({ sid = null, cids = null }) {
  let mode = "diff";
  const body = h("div", { class: "sheet-body" });
  const segBtns = [["orig", "Bài gốc"], ["diff", "Bài sửa"]].map(([k, t]) => h("button", { type: "button", "data-k": k, "aria-pressed": String(k === mode), onclick: () => { mode = k; segBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k))); draw(); } }, t));
  const trBy = {};
  L.task_comments.forEach(t => { const last = t.sentence_ids[t.sentence_ids.length - 1]; if (last) trBy[last] = t; });
  const clearNotes = () => body.querySelectorAll(".note").forEach(n => n.remove());
  function draw() {
    const essay = h("div", { class: "essay" });
    L.essay.paragraphs.forEach(p => {
      const para = h("p", {});
      p.sentences.forEach((s, i) => {
        if (i) para.append(" ");
        const span = sentence(s.id, { mode: mode === "diff" ? "diff" : "orig" });
        span.querySelectorAll(".corr").forEach(x => x.addEventListener("click", () => {
          clearNotes(); const cc = C[x.dataset.c];
          para.after(h("div", { class: "note" }, h("div", { class: "nh" }, (cc.orig.trim() || "…") + "  →  " + (cc.fix.trim() || "bỏ")), cc.comment));
        }));
        if (s.id === sid) span.classList.add("hl");
        if (cids) span.querySelectorAll(".corr").forEach(x => { if (cids.includes(x.dataset.c)) x.classList.add("focus"); });
        para.append(span);
        if (trBy[s.id]) para.append(h("button", { class: "tr-mark", type: "button", "aria-label": "Nhận xét về ý", onclick: () => { clearNotes(); para.after(h("div", { class: "note" }, trBy[s.id].comment)); } }, img("icon_bulb")));
      });
      essay.append(para);
    });
    body.replaceChildren(h("div", { class: "prompt" }, h("div", { class: "label" }, "Đề bài"), h("span", { class: "en" }, L.prompt)), essay);
  }
  draw();
  sheet("Bài của " + NAME, h("div", { class: "seg" }, segBtns), body);
  if (sid) requestAnimationFrame(() => { const t = body.querySelector(".s.hl"); if (t) t.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" }); });
}
$("#essayBtn").addEventListener("click", () => openEssay({}));

$("#sproutIcon").src = A.icon_sprout;
