<title>Đậu ôn bài · __TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one phone-sized screen at a time, never scrolls. Progress on top, anh Đậu's bubble under it,
   the current card fills the middle, action bar at the bottom. The student moves every step forward
   (tap or button). Đậu orange is the only loud colour; mint = đúng, coral = sai; the essay paper uses
   the ô ly grid of a Vietnamese school notebook. */
:root {
  --bg: #F3F8F4;
  --paper: #FFFFFF;
  --ink: #2B2420;
  --muted: #7A6E66;
  --line: #E6DDD3;
  --orange: #FF9800;
  --orange-deep: #C65D00;
  --orange-soft: #FFF0DB;
  --mint: #8DD9B8;
  --mint-deep: #1F8A63;
  --mint-soft: #E3F5EC;
  --coral: #D9483B;
  --coral-soft: #FCE6E2;
  --blush-soft: #FDEBE7;
  --sky-soft: #E3EFFB;
  --sky-deep: #2F6CA6;
  --yellow-soft: #FFF1C7;
  --yellow-deep: #8A5A00;
  --yellow: #E0A800;
  --chalk: #F4F1E6;
  --grid: rgba(80, 140, 200, .10);
  --grid-strong: rgba(80, 140, 200, .20);
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 18px rgba(60, 40, 20, .07);
  --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-chalk: "Patrick Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1815; --paper: #26211D; --ink: #F3ECE5; --muted: #B4A79C; --line: #3A322C;
    --orange: #FFA42E; --orange-deep: #FFB866; --orange-soft: #3A2A17;
    --mint: #6FC9A2; --mint-deep: #7FD8B1; --mint-soft: #1D3A2E;
    --coral: #FF8373; --coral-soft: #402421; --blush-soft: #3A2622; --chalk: #F4F1E6; --sky-soft: #1D2F42; --sky-deep: #8FC3F2;
    --yellow-soft: #3A3115; --yellow-deep: #F2CC6B; --yellow: #E0B53A;
    --grid: rgba(120, 170, 230, .07); --grid-strong: rgba(120, 170, 230, .13);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1815; --paper: #26211D; --ink: #F3ECE5; --muted: #B4A79C; --line: #3A322C;
  --yellow-soft: #3A3115; --yellow-deep: #F2CC6B; --yellow: #E0B53A;
  --orange: #FFA42E; --orange-deep: #FFB866; --orange-soft: #3A2A17;
  --mint: #6FC9A2; --mint-deep: #7FD8B1; --mint-soft: #1D3A2E;
  --coral: #FF8373; --coral-soft: #402421; --blush-soft: #3A2622; --chalk: #F4F1E6; --sky-soft: #1D2F42; --sky-deep: #8FC3F2;
  --grid: rgba(120, 170, 230, .07); --grid-strong: rgba(120, 170, 230, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 10px; }
/* no blue flash on tap (phones), and focus rings only for keyboard users */
* { -webkit-tap-highlight-color: transparent; }
:focus:not(:focus-visible) { outline: none; }
.sheet:focus { outline: none; }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; overflow: hidden; }

/* top bar */
.top { position: relative; z-index: 9; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 6px; display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.tabs { flex: 1; min-width: 0; display: flex; gap: 4px; }
.tab { flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 4px 2px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; transition: background .25s, border-color .25s, flex-grow .45s ease, transform .15s ease; }
@media (hover: hover) { .tab:hover { transform: scale(1.06); } }
.tab:active { transform: scale(.94); }
.tab.pulse { animation: tabPulse .6s ease; }
@keyframes tabPulse { 40% { transform: scale(1.14); } }
.burst { position: fixed; z-index: 60; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; animation: burstOut .8s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes burstOut { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
/* the roadmap: the four parts in order */
.roadmap { display: flex; flex-direction: column; gap: 8px; }
.road { display: flex; align-items: center; gap: 12px; padding: .7em .9em; animation: rise .4s both; }
.road b { font: 800 1.25em/1 var(--font-display); color: var(--orange-deep); min-width: 2.6em; }
.road span { font-weight: 600; }
.road em { margin-left: auto; font-style: normal; color: var(--muted); font-size: .85em; }
.road-arrow { text-align: center; color: var(--muted); line-height: 1; }
.focus-callout { display: flex; gap: .7em; align-items: center; border: 2px solid var(--orange); background: var(--orange-soft); animation: popIn .45s cubic-bezier(.3, 1.5, .5, 1) both; }
.focus-callout .label { color: var(--orange-deep); }
.focus-callout b { font: 800 1.15em/1.3 var(--font-display); }
.tab b { font: 800 12px/1 var(--font-display); letter-spacing: .04em; color: var(--muted); }
.tab span { font: 700 11px/1 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.tab span[hidden] { display: none; }
@media (max-width: 420px) { .tab span { font-size: 10px; } }
.tab[aria-current="true"] { background: var(--orange-soft); border-color: var(--orange); }
.tab[aria-current="true"] b, .tab[aria-current="true"] span { color: var(--orange-deep); }
.essay-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.essay-btn img { width: 20px; height: 20px; object-fit: contain; }
.prompt-btn { padding: 5px 11px; }
/* the prompt (and the chart) on every screen: a sheet on phones, a panel beside the lesson on wide screens */
.side-prompt { display: none; position: fixed; top: 16px; left: calc(50% - 240px - 336px); width: 312px; max-height: calc(100% - 32px); overflow-y: auto; flex-direction: column; gap: 10px; z-index: 5; }
.side-prompt .label { margin-bottom: 2px; }
body.wide .side-prompt { display: flex; }
body.wide .prompt-btn { display: none; }
.bar { position: relative; height: 12px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--line); }
.bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--orange)); transition: width .6s cubic-bezier(.3, .9, .3, 1); }
.bar-sprout { position: absolute; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -62%); transition: left .6s cubic-bezier(.3, .9, .3, 1); pointer-events: none; }
.bar-sprout img { width: 100%; height: 100%; object-fit: contain; }

/* stage: fixed height, never scrolls */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.scene { position: absolute; inset: 0; padding: 8px 16px 6px; display: flex; flex-direction: column; gap: 10px; --k: 1; }
.scene.in { animation: sceneIn .45s cubic-bezier(.2, .9, .3, 1) both; }
.scene.in.back { animation-name: sceneBack; }
@keyframes sceneIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes sceneBack { from { opacity: 0; transform: translateX(-40px); } }

/* anh Đậu: a character outside the app. When he talks the page dims, the card he is talking
   about stays lit (the spotlight), and he leans in from the left edge with his speech bubble. */
/* focus instead of a dark overlay: what he is talking about stays crisp and lifts a little,
   everything else fades back */
.content > * { transition: opacity .35s ease, filter .35s ease, box-shadow .35s ease, translate .35s ease; }
.app.dau-talk .content > .spot { translate: 0 -3px; }
.app.dau-talk .content > .spot.card { box-shadow: 0 2px 4px rgba(60, 40, 20, .06), 0 18px 40px rgba(60, 40, 20, .16); }
/* while there is a question on the page, nothing fades: the question, its answers and what it is about */
.app.nofade .content > * { opacity: 1 !important; filter: none !important; }
/* while Đậu talks the bottom bar steps back, except the back button: one step back is always there */
.app.dau-talk .bottom { pointer-events: none; }
.app.dau-talk .bottom > *:not(.btn-back) { visibility: hidden; }
.app.dau-talk .btn-back { pointer-events: auto; }
.dau-layer { position: absolute; left: 0; right: 0; bottom: 0; top: var(--top-h, 70px); z-index: 8; pointer-events: none; }
.catch { position: absolute; inset: 0; display: none; pointer-events: auto; touch-action: none; cursor: pointer; }
.app.dau-talk .catch { display: block; }
.dgroup { position: absolute; left: 0; right: 0; top: 40%; display: flex; align-items: flex-end; padding-right: 14px; transition: top .35s cubic-bezier(.3, .9, .3, 1); pointer-events: none; }
/* he never stands on the page: while he talks the card area ends above him (--dau-h) and he waits
   at the bottom, just over the Tiếp bar; the card he means lifts instead of him moving to it */
.app.dau-talk .content { margin-bottom: var(--dau-h, 0px); }
.dau { flex: none; width: 128px; margin-left: -18px; transform: translateX(-120%) rotate(-8deg); transform-origin: 30% 100%; transition: transform .55s cubic-bezier(.3, 1.35, .45, 1); pointer-events: auto; cursor: pointer; }
.app.dau-talk .dau { transform: translateX(0) rotate(6deg); }
/* entrance: his head peeks round the left edge first, then he hops in */
.app.dau-talk.peek .dau { transform: translateX(-30%) rotate(12deg); transition: transform .4s cubic-bezier(.2, .8, .3, 1); }
.app.dau-talk.peek .say { opacity: 0; transform: scale(.6); transition-delay: 0s; }
.app.leaving .dau { transition-delay: .25s; }
.dgroup.nomove { transition: none; }
.say { position: relative; flex: 1; min-width: 0; align-self: flex-start; margin: 0 0 0 16px; background: #FFFDF8; color: #2B2420; border: 2.5px solid var(--orange); border-radius: 20px; padding: 18px 16px 24px; min-height: 84px; font-size: 18px; line-height: 1.45; box-shadow: 0 6px 0 rgba(0, 0, 0, .12); pointer-events: auto; cursor: pointer; opacity: 0; transform: scale(.6); transform-origin: 0 100%; transition: opacity .2s, transform .35s cubic-bezier(.3, 1.4, .5, 1); }
.app.dau-talk .say { opacity: 1; transform: none; transition-delay: .15s; }
/* once he has stepped aside, his (invisible) bubble and body must not catch taps meant for the page */
.app:not(.dau-talk) .say, .app:not(.dau-talk) .dau { pointer-events: none; }
.say::before { content: ""; position: absolute; left: -11px; bottom: 26px; width: 18px; height: 18px; background: #FFFDF8; border-left: 2.5px solid var(--orange); border-bottom: 2.5px solid var(--orange); transform: rotate(45deg); border-bottom-left-radius: 4px; }
.say.pop { animation: boxPop .3s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes boxPop { from { transform: scale(.95); } }
.tag { position: absolute; top: -13px; left: 14px; background: var(--orange); color: #3A1D00; font: 800 11.5px/1 var(--font-display); letter-spacing: .07em; text-transform: uppercase; padding: 5px 10px 4px; border-radius: 999px; }
.more-ind { position: absolute; right: 12px; bottom: 5px; display: none; align-items: center; gap: 4px; font: 700 11.5px var(--font-display); color: #C65D00; }
.more-ind b { display: inline-block; animation: nudgeDown 1s ease-in-out infinite; }
@keyframes nudgeDown { 50% { transform: translateY(3px); } }
.app.more .more-ind { display: inline-flex; }
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9A8E85; opacity: .5; animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { opacity: 1; transform: translateY(-3px); } }
.qtext { font: 700 1.1em/1.3 var(--font-display); }

/* anh Đậu, built from ChatGPT's separate layers; every part moves on its own */
.rig { position: relative; width: 100%; aspect-ratio: 380 / 366; animation: dbob 3.2s ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .22)); }
@keyframes dbob { 50% { transform: translateY(-4px); } }
.rig .l { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.l-sprout { transform-origin: 49.8% 23.6%; animation: sway 2.8s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
.l-arm_l, .l-arm_r { transition: transform .45s cubic-bezier(.3, 1.4, .5, 1); }
.l-arm_l { transform-origin: 21.9% 59.7%; }
.l-arm_r { transform-origin: 82.1% 59.7%; }
.a-wave .l-arm_r { animation: wave 1s ease-in-out infinite; }
@keyframes wave { 0%, 100% { transform: rotate(-140deg); } 50% { transform: rotate(-110deg); } }
.a-point .l-arm_r { transform: rotate(-72deg); }
.a-up .l-arm_r { transform: rotate(-125deg); }
.a-cheer .l-arm_l { animation: cheerL .6s ease-in-out infinite alternate; }
.a-cheer .l-arm_r { animation: cheerR .6s ease-in-out infinite alternate; }
@keyframes cheerL { from { transform: rotate(115deg); } to { transform: rotate(135deg); } }
@keyframes cheerR { from { transform: rotate(-115deg); } to { transform: rotate(-135deg); } }
.a-think .l-arm_r { transform: rotate(55deg); }
.a-oops .l-arm_l { transform: rotate(-40deg); }
.a-oops .l-arm_r { transform: rotate(40deg); }
/* eyes: happy ^ ^ by default; open while talking, with blinks and glances */
.rig .l-eyes_open, .rig .l-eyes_blink, .rig .l-eyes_left, .rig .l-eyes_right, .rig .l-eyes_up,
.rig .l-mouth_talk, .rig .l-mouth_laugh, .rig .l-mouth_o { display: none; }
.rig.e-open .l-eyes_happy { display: none; }
.rig.e-open .l-eyes_open { display: block; }
.rig.e-open.look-l .l-eyes_open, .rig.e-open.look-r .l-eyes_open, .rig.e-open.look-up .l-eyes_open { display: none; }
.rig.e-open.look-l:not(.look-up) .l-eyes_left { display: block; }
.rig.e-open.look-r:not(.look-up) .l-eyes_right { display: block; }
.rig.e-open.look-up .l-eyes_up { display: block; }
.rig.e-open.blink .l-eyes_open, .rig.e-open.blink .l-eyes_left, .rig.e-open.blink .l-eyes_right, .rig.e-open.blink .l-eyes_up { display: none; }
.rig.e-open.blink .l-eyes_blink { display: block; }
/* mouth: smile by default, flaps while he talks */
.rig.m-talk .l-mouth_talk { display: block; animation: talkA .3s steps(1) infinite; }
.rig.m-talk .l-mouth_smile { animation: talkB .3s steps(1) infinite; }
@keyframes talkA { 50% { opacity: 0; } }
@keyframes talkB { 0% { opacity: 0; } 50% { opacity: 1; } }
.rig.m-laugh .l-mouth_laugh, .rig.m-o .l-mouth_o { display: block; }
.rig.m-laugh .l-mouth_smile, .rig.m-o .l-mouth_smile { display: none; }

/* the card area */
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .7em; font-size: calc(16px * var(--k)); }
.content > * { flex-shrink: 0; }
.content.overflow { overflow-y: auto; touch-action: pan-y; }
.enter { animation: upIn .5s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes upIn { from { opacity: 0; transform: translateY(36px); } }
.rise { animation: rise .45s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.instant, .instant * { animation-duration: 1ms !important; animation-delay: 0ms !important; transition: none !important; }

/* bottom bar */
.bottom { padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 10px; position: relative; z-index: 9; }
.btn { border: 0; border-radius: 16px; padding: 14px 18px; font: 700 17px/1 var(--font-display); cursor: pointer; transition: transform .12s, opacity .2s; }
.btn:active { transform: translateY(2px); }
.btn-main { flex: 1; background: var(--orange); color: #3A1D00; box-shadow: 0 4px 0 var(--orange-deep); }
.btn-main.wait { opacity: .4; box-shadow: none; }
.btn-back { width: 52px; background: var(--paper); border: 1.5px solid var(--line); color: var(--muted); font-size: 22px; padding: 0; }
.btn-back:disabled { visibility: hidden; }
.btn-check { flex: none; align-self: stretch; }
.btn-check:disabled { opacity: .45; box-shadow: none; cursor: default; }
.btn-ghost { background: var(--paper); border: 1.5px solid var(--line); color: var(--ink); box-shadow: 0 3px 0 var(--line); font-size: .95em; padding: .75em 1em; }

/* "chạm để tiếp" hint, shown when Đậu is away and the page is waiting */
.hint { position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%); display: none; align-items: center; gap: 6px; padding: 5px 14px 5px 10px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; pointer-events: auto; cursor: pointer; }
.app.hint-on .hint { display: flex; animation: rise .4s both; }
.hint b { color: var(--orange); display: inline-block; animation: nudgeDown 1s ease-in-out infinite; }
@keyframes up { 50% { transform: translateY(-4px); } }

/* generic pieces */
.card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; padding: .9em 1em; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; border-radius: 999px; padding: .15em .7em; font: 700 .8em/1.5 var(--font-display); letter-spacing: .02em; }
.tone-orange { background: var(--orange-soft); color: var(--orange-deep); }
.tone-mint { background: var(--mint-soft); color: var(--mint-deep); }
.tone-blush { background: var(--blush-soft); color: var(--coral); }
.tone-sky { background: var(--sky-soft); color: var(--sky-deep); }
.h { font: 800 1.6em/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.h2 { font: 700 1.2em/1.25 var(--font-display); margin: 0; text-wrap: balance; }
.label { font: 700 .72em var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88em; }
.en { font-style: italic; }
.quote { font-size: .95em; line-height: 1.6; }
.quote::before, .quote::after { font: 800 1.4em/0 var(--font-display); color: var(--orange); vertical-align: -.3em; }
.quote::before { content: "“"; margin-right: 2px; } .quote::after { content: "”"; margin-left: 1px; }
.cite { display: inline-flex; align-self: flex-start; align-items: center; gap: 5px; border: 0; background: none; color: var(--orange-deep); font: 600 .82em var(--font-body); padding: 2px 0; cursor: pointer; }
.cite svg { width: 14px; height: 14px; }
.stack { display: flex; flex-direction: column; gap: .6em; }
.row { display: flex; gap: .6em; align-items: center; }
.icon { width: 1.6em; height: 1.6em; object-fit: contain; flex: none; }

/* choices */
.choices { display: flex; flex-direction: column; gap: .55em; }
.choice { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 16px; padding: .7em 1em; font-weight: 600; font-size: 1em; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: border-color .2s, background .2s; }
.choice:active { transform: translateY(2px); box-shadow: none; }
.choice.right { border-color: var(--mint-deep); background: var(--mint-soft); box-shadow: 0 3px 0 var(--mint); }
.choice.wrong { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 3px 0 var(--coral); animation: shake .4s; }
.choice:disabled { cursor: default; }
.choice.en { font-style: italic; font-weight: 500; }
.nudge { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* results */
.big-num { font: 800 3.4em/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--orange-deep); }
.big-num small { font: 600 .32em var(--font-body); color: var(--muted); margin-left: 6px; }
.meter { position: relative; height: 12px; border-radius: 999px; background: var(--bg); border: 1.5px solid var(--line); margin-top: 1.2em; }
.meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; background: var(--mint); transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
.meter-mark { position: absolute; top: -18px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }
.meter-mark span { position: absolute; top: -3px; left: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; perspective: 600px; }
.score { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: .5em .2em .45em; text-align: center; animation: flip .5s cubic-bezier(.2, .9, .3, 1) both; box-shadow: var(--shadow); }
.score b { display: block; font: 800 1.8em/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.score span { display: block; font: 700 .72em var(--font-display); color: var(--muted); letter-spacing: .06em; }
.score em { display: block; font-style: normal; font-size: .66em; color: var(--muted); }
@keyframes flip { from { transform: rotateY(90deg); opacity: 0; } }
.overall { display: flex; align-items: center; gap: 1em; }
.ring { width: 2.4em; height: 2.4em; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #3A1D00; font: 800 1.9em/1 var(--font-display); font-variant-numeric: tabular-nums; box-shadow: 0 0 0 5px var(--orange-soft); animation: popIn .6s cubic-bezier(.3, 1.6, .5, 1) both; }

/* framework */
.fw-card { display: flex; flex-direction: column; gap: .6em; }
.summary { font-weight: 600; display: flex; gap: .55em; align-items: flex-start; }
.dau-mini { width: 1.9em; height: 1.9em; flex: none; object-fit: contain; margin-top: -.15em; }
.skeleton { align-items: center; gap: .3em; }
.skeleton .pill { align-self: center; }
.node.fold { align-self: center; padding: 0 .8em; background: none; color: var(--muted); }
.sk-arrow { color: var(--muted); font-weight: 700; line-height: 1; }
mark.hl { background: linear-gradient(transparent 55%, var(--orange-soft) 55%); color: inherit; font-weight: 600; padding: 0 .1em; }
.count { display: inline-block; }
.count.bump { animation: bump .3s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 40% { transform: scale(1.25); } }
.backchip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: .2em .8em .2em .6em; font: 600 .82em var(--font-body); color: var(--muted); cursor: pointer; }
.mcard.minor .chev { color: var(--muted); }
.idea-chip { display: flex; gap: .7em; align-items: baseline; padding: .5em .8em; border-radius: 12px; background: var(--bg); animation: popIn .45s cubic-bezier(.3, 1.5, .5, 1) both; }
.idea-chip b { font: 700 .72em var(--font-display); letter-spacing: .05em; color: var(--muted); white-space: nowrap; text-transform: uppercase; }
.map { display: grid; grid-template-columns: auto 1fr 1fr; gap: .5em; align-items: center; }
.map .lab { display: flex; align-items: center; gap: .45em; font: 700 .9em var(--font-display); white-space: nowrap; animation: rise .4s both; }
.map .wide { grid-column: 2 / 4; font-size: .85em; color: var(--muted); animation: rise .4s both; }
.map .chip { font-size: .85em; font-weight: 600; text-align: center; padding: .45em .5em; border-radius: 12px; line-height: 1.3; animation: popIn .4s cubic-bezier(.3, 1.5, .5, 1) both; }
.map .c { background: var(--mint-soft); color: var(--mint-deep); }
.map .s { background: var(--sky-soft); color: var(--sky-deep); }
.map .o { background: var(--orange-soft); color: var(--orange-deep); }
.map .y { background: var(--yellow-soft); color: var(--yellow-deep); }
.map .r { background: var(--coral-soft); color: var(--coral); }
.map-legend { display: flex; flex-wrap: wrap; gap: .4em 1em; font-size: .8em; color: var(--muted); margin-top: .2em; }
.map-legend span { display: inline-flex; align-items: center; gap: .35em; }
.map-legend i { width: .8em; height: .8em; border-radius: 4px; }
.map-legend i.c { background: var(--mint-soft); box-shadow: inset 0 0 0 1.5px var(--mint-deep); }
.map-legend i.y { background: var(--yellow-soft); box-shadow: inset 0 0 0 1.5px var(--yellow); }
.map-legend i.r { background: var(--coral-soft); box-shadow: inset 0 0 0 1.5px var(--coral); }
/* Task 1 */
.t1-type { display: block; font: 700 .7em/1.2 var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--orange-deep); }
.chart-card { padding: .7em .8em; }
.chart-scroll { overflow-x: auto; }
.chart-table { border-collapse: collapse; width: 100%; font-size: .85em; }
.chart-table th, .chart-table td { padding: .3em .45em; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.chart-table tbody th { text-align: left; font-weight: 600; white-space: normal; }
.chart-table thead th { color: var(--muted); font-weight: 700; }
.chart-table thead th.on { color: var(--orange-deep); }
.chart-table tr.on th { color: var(--orange-deep); }
.map-rows { display: flex; flex-direction: column; gap: 2px; font-size: .85em; }
.map-row { padding: .35em .4em; border-bottom: 1px solid var(--line); border-radius: 8px; }
.map-row > b { display: block; font-weight: 700; margin-bottom: 1px; }
.map-row.on > b { color: var(--orange-deep); }
.map-cell { display: flex; gap: .5em; line-height: 1.35; }
.map-cell .k { flex: 0 0 3.6em; color: var(--muted); font-weight: 700; }
.map-cell.hit { background: var(--orange-soft); color: var(--orange-deep); font-weight: 700; border-radius: 6px; }
.chart-table td.hit { background: var(--orange-soft); color: var(--orange-deep); font-weight: 800; border-radius: 6px; }
.line-chart { width: 100%; height: auto; display: block; }
.line-chart text { font: 600 9px var(--font-body); fill: var(--muted); }
.line-chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: .3em .8em; font-size: .8em; margin-top: .3em; }
.legend span { display: inline-flex; align-items: center; gap: .3em; color: var(--muted); }
.legend span.on { color: var(--ink); font-weight: 700; }
.legend i { width: .9em; height: .25em; border-radius: 2px; display: inline-block; }
.data-item { display: flex; gap: .7em; align-items: flex-start; }
.data-item .t { flex: 1; min-width: 0; }
.data-item.bad { border-color: var(--coral); }
.data-item .fix { color: var(--mint-deep); font-weight: 700; font-size: .92em; margin-top: .2em; }
.check-line { display: flex; gap: .6em; align-items: flex-start; font-size: .92em; }
.map .down { text-align: center; color: var(--orange); font-weight: 800; line-height: 1; animation: rise .4s both; }
.tick { width: 1.5em; height: 1.5em; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--mint-soft); }
.tick.no { background: var(--coral-soft); }
.tick svg { width: 62%; height: 62%; stroke: var(--mint-deep); stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .15s forwards; }
.tick.no svg { stroke: var(--coral); }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* idea chains */
.chain { display: flex; flex-direction: column; align-items: stretch; }
.node { padding: .45em .85em; border-radius: 12px; background: var(--mint-soft); font-weight: 600; font-size: .92em; animation: popIn .45s cubic-bezier(.3, 1.5, .5, 1) both; }
.node.bad { background: var(--coral-soft); color: var(--coral); font-style: italic; }
.node.new { background: transparent; border: 2px dashed var(--mint-deep); color: var(--mint-deep); }
/* her chain once a new direction (or a fix from a wrong link on) replaces it */
.node.old { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1.5px; font-size: .84em; padding: .3em .8em; animation: none; }
.chain-new { margin-top: .9em; padding-top: .8em; border-top: 1.5px dashed var(--line); }
.fix-mark { align-self: center; font: 700 .8em var(--font-display); color: var(--mint-deep); padding: .3em .8em; border-radius: 999px; background: var(--mint-soft); margin-top: .3em; animation: popIn .4s both; }
.arrow { align-self: center; width: 2px; height: .75em; background: var(--muted); opacity: .45; position: relative; animation: rise .3s both; }
.arrow::after { content: ""; position: absolute; left: -4px; bottom: -2px; border: 5px solid transparent; border-top-color: var(--muted); border-bottom: 0; }
.gap-mark { align-self: center; font: 700 .8em var(--font-display); color: var(--coral); padding: .3em .8em; border-radius: 999px; background: var(--coral-soft); margin-top: .3em; animation: popIn .4s both; }
.flow-en { font-size: .8em; color: var(--muted); line-height: 1.5; }
.ov { display: flex; gap: .75em; align-items: center; padding: .7em .9em; animation: rise .45s both; }
.ov .t { flex: 1; min-width: 0; }
.ov .t b { display: block; font-size: .95em; }
.ov .t span { font-size: .82em; color: var(--muted); }

.ov.tap { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; border-color: var(--coral); }
.ov.tap:active { transform: translateY(2px); }
.chev { flex: none; font: 800 1.5em/1 var(--font-display); color: var(--coral); }
.ov.tap .go { color: var(--coral); font-weight: 600; }
.ov.tap.improve { border-color: var(--yellow); }
.ov.tap.improve .go, .ov.tap.improve .chev { color: var(--yellow-deep); }
.icon.tilde { display: inline-grid; place-items: center; border-radius: 50%; background: var(--yellow-soft); color: var(--yellow-deep); font: 900 1em/1 var(--font-display); }
.icon.tilde b { font-size: 1.5em; line-height: 1; margin-top: -.15em; }
.ov.reveal .go, .ov.reveal .chev { animation: hintIn .5s ease both; }
@keyframes hintIn { from { opacity: 0; } }
.idea-name { font-weight: 700; font-size: .92em; }
.tr-note + .tr-note { margin-top: .9em; }
.seg-row { display: flex; gap: 8px; align-items: stretch; }
.seg-row .seg { flex: 1; min-width: 0; }
.step-start { flex: none; padding: .5em .8em; font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1.5px solid var(--line); background: var(--paper); }
.stepper[hidden], .step-start[hidden] { display: none; }
.stepper .btn { flex: none; min-width: 52px; padding: .55em .9em; }
.stepper .btn:disabled { opacity: .4; }
.step-label { flex: 1; min-width: 0; text-align: center; font-weight: 700; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cpop-quote { font-weight: 700; font-style: italic; margin-bottom: .35em; white-space: normal; }
.tr-hl { background: rgba(255, 190, 60, .22); border-bottom: 2px dotted var(--orange); border-radius: 3px; cursor: pointer; }
.tr-hl.active { background: var(--orange-soft); outline: 2px solid var(--orange); }
.tr-add { border: 0; background: var(--mint-soft); color: var(--mint-deep); font: inherit; font-weight: 600; border-radius: 6px; padding: 0 5px; cursor: pointer; }
.tr-add.active { outline: 2px solid var(--orange); }
.pt-comment { font-size: .86em; margin-top: .5em; color: var(--muted); }
.pt-comment b { color: var(--ink); font-weight: 600; }
.pt-better { margin-top: .45em; padding: .5em .7em; border-radius: 10px; background: var(--mint-soft); font-size: .92em; }
.pt-better .lbl { display: block; font: 700 .72em/1.2 var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--mint-deep); margin-bottom: .2em; }
.explain { font-size: .9em; padding: .55em .8em; border-radius: 12px; background: var(--orange-soft); border-left: 3px solid var(--orange); animation: rise .35s both; }
button.mcard { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.mcard.main { border: 2px solid var(--orange); background: var(--orange-soft); padding: .9em 1em; }
.mcard.main .n { background: var(--orange); color: #3A1D00; }
.mcard.main .t b { font: 800 1.15em/1.25 var(--font-display); }
.mcard.minor { opacity: .5; box-shadow: none; padding: .45em .8em; font-size: .88em; }
.mcard.minor .n { width: 2.2em; height: 2.2em; }
.num { width: 1.9em; height: 1.9em; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange-deep); font: 800 1em var(--font-display); }
.quote-card { text-align: center; padding: 1.3em 1.2em; display: flex; flex-direction: column; gap: .6em; align-items: center; }
.quote-card .qt { font: 700 1.2em/1.45 var(--font-display); font-style: italic; text-wrap: balance; }
.quote-card .qs { font: 700 .75em var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--orange-deep); }
.quote-card .qm { font-size: .9em; color: var(--muted); }
.quote-card .qt::before { content: "“"; color: var(--orange); } .quote-card .qt::after { content: "”"; color: var(--orange); }

/* linking */
.lg-label { font: 700 .72em var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: .35em; }
.chips { display: flex; flex-wrap: wrap; gap: .45em; }
.lchip { border: 0; border-radius: 10px; padding: .35em .7em; background: var(--orange-soft); color: var(--orange-deep); font-weight: 600; font-size: .88em; font-style: italic; cursor: pointer; animation: popIn .4s cubic-bezier(.3, 1.5, .5, 1) both; }
.swap { display: flex; flex-direction: column; gap: .35em; }
.swap .from { color: var(--coral); text-decoration: line-through; text-decoration-thickness: 2px; font-style: italic; }
.swap .to { color: var(--mint-deep); font-weight: 600; font-style: italic; }

/* corrections inside sentences */
.err { text-decoration: underline wavy var(--coral); text-decoration-thickness: 1.5px; text-underline-offset: 4px; font-weight: 600; }
.err.gap { display: inline-block; min-width: 18px; height: 1.1em; vertical-align: -2px; border-bottom: 2.5px dashed var(--coral); }
.corr s { color: var(--coral); text-decoration-thickness: 2px; }
.corr ins { text-decoration: none; background: var(--mint-soft); color: var(--mint-deep); font-weight: 600; border-radius: 4px; padding: 0 2px; }
.corr.live s { background: linear-gradient(var(--coral), var(--coral)) no-repeat 0 55% / 0 2px; text-decoration: none; animation: strike .45s forwards; }
.corr.live ins { display: inline-block; animation: popIn .4s .4s cubic-bezier(.3, 1.5, .5, 1) both; }
@keyframes strike { to { background-size: 100% 2px; } }
/* several fixes in one place play one after another (--d set per fix) */
.corr.live s { animation-delay: var(--d, 0s); }
.corr.live ins { animation-delay: calc(var(--d, 0s) + .4s); }
.prev-ctx { color: var(--muted); }
mark.hl-bad { background: linear-gradient(transparent 55%, var(--coral-soft) 55%); color: var(--coral); font-weight: 600; padding: 0 .1em; }
.fw-rule { display: flex; gap: .7em; align-items: center; border: 2px solid var(--orange); background: var(--orange-soft); animation: popIn .45s cubic-bezier(.3, 1.5, .5, 1) both; }
.fw-rule b { font-weight: 600; line-height: 1.4; }
.quote.lit { background: linear-gradient(transparent 8%, var(--coral-soft) 8%, var(--coral-soft) 92%, transparent 92%); border-radius: 6px; transition: background .4s; }
mark.hl-good { background: linear-gradient(transparent 55%, var(--mint-soft) 55%); color: var(--mint-deep); font-weight: 600; padding: 0 .1em; }
.pt-comment.rise, .pt-better.rise { animation: rise .4s both; }
/* praise is green, never the red wavy of a mistake */
mark.good { background: var(--mint-soft); color: var(--mint-deep); font-weight: 600; border-radius: 4px; padding: 0 .15em; }
.tr-hl.good { background: var(--mint-soft); border-bottom-color: var(--mint-deep); }
/* nâng cấp: her words stay (no strike), the better version comes after an arrow */
.err.up { text-decoration: underline dotted var(--orange); text-decoration-thickness: 2.5px; }
.corr.up s, .corr.live.up s { text-decoration: none; background: none; animation: none; color: inherit; border-bottom: 2.5px dotted var(--orange); }
.corr.up s::after { content: " →"; color: var(--orange-deep); font-weight: 800; }
.pill img { width: 1.15em; height: 1.15em; vertical-align: -.22em; margin-right: .3em; }
/* a sticker beside a question, and the section title cards */
.ask-q { display: flex; gap: .6em; align-items: center; }
.ask-q .qtext { flex: 1; }
.ask-icon { width: 3.2em; height: 3.2em; flex: none; object-fit: contain; animation: popIn .45s both; }
.explain.oops { display: flex; gap: .6em; align-items: center; }
.explain.oops img { width: 2.8em; height: 2.8em; flex: none; object-fit: contain; }
.explain.mini-say { display: flex; gap: .6em; align-items: center; }
.explain.mini-say.oops { background: var(--coral-soft); border-left-color: var(--coral); }
.explain.mini-say img { width: 2.8em; height: 2.8em; flex: none; object-fit: contain; animation: popIn .4s cubic-bezier(.3, 1.5, .5, 1) both; }
.explain.mini-say b { display: block; font-weight: 700; }
.explain.mini-say span { display: block; margin-top: .15em; }
/* practice streak */
.streak { display: inline-flex; align-items: center; gap: .3em; font: 800 .8em var(--font-display); color: #C2410C; background: #FFEAD5; border-radius: 999px; padding: .15em .6em .15em .3em; animation: popIn .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.streak img { width: 1.5em; height: 1.5em; }
/* the overall score: suspense, then a celebration that grows with the band */
.overall { position: relative; }
.overall .ring { position: relative; z-index: 1; }
.ring.squash { animation: squash .55s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes squash { 0% { transform: scale(1); } 30% { transform: scale(1.28, .78); } 60% { transform: scale(.9, 1.14); } 100% { transform: scale(1); } }
.ring.pct::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; background: conic-gradient(var(--orange-deep) calc(var(--p, 0) * 1%), var(--orange-soft) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); }
.ring.pct { box-shadow: none; }
.ring.gold { background: linear-gradient(135deg, #FFD166, #FF9800); box-shadow: 0 0 0 5px #FFE9B0, 0 0 26px rgba(255, 186, 60, .75); }
.ring.shine { overflow: hidden; }
.ring.shine::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .8) 50%, transparent 70%); transform: translateX(-130%); animation: shine 1.4s .2s ease-in-out 3; }
@keyframes shine { to { transform: translateX(130%); } }
.ring-wrap { position: relative; flex: none; display: grid; place-items: center; margin: 0 .45em 0 .3em; }
.stamp-star { position: absolute; left: 50%; top: 50%; width: 160%; height: 160%; translate: -50% -52%; z-index: 0; pointer-events: none; animation: starIn .65s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes starIn { from { transform: scale(3.2) rotate(-120deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }
.shock { position: absolute; left: 50%; top: 50%; width: 1.4em; height: 1.4em; margin: -.7em 0 0 -.7em; border-radius: 50%; border: 4px solid #FFB547; pointer-events: none; animation: shock .75s ease-out forwards; }
@keyframes shock { to { transform: scale(10); opacity: 0; } }
.xs-badge { align-self: center; display: flex; align-items: center; gap: .5em; padding: .4em 1.2em .4em .6em; border-radius: 999px; background: linear-gradient(135deg, #FFE08A, #FFB547); color: #5A3200; font: 800 1.25em var(--font-display); box-shadow: 0 8px 22px rgba(255, 160, 40, .45); animation: stampIn .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.xs-badge img { width: 2em; height: 2em; }
@keyframes stampIn { from { transform: scale(2.6) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
.dimmer { position: fixed; inset: 0; z-index: 40; background: rgba(28, 18, 8, .62); opacity: 0; transition: opacity .45s; pointer-events: none; }
.dimmer.on { opacity: 1; }
.app.shake #stage { animation: shake .42s; }
@media (prefers-reduced-motion: reduce) { .stamp-star, .xs-badge, .ring.squash, .ring.shine::after, .streak, .ask-icon { animation: none; } }
.snip { display: flex; gap: .6em; align-items: flex-start; padding: .55em .8em; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.snip .quote, .snip-col { flex: 1; min-width: 0; }
.snip .pin { flex: none; width: 16px; height: 16px; color: var(--orange-deep); margin-top: .25em; }
.times { display: flex; align-items: center; gap: .8em; }
.times .n { font: 800 2.8em/1 var(--font-display); color: var(--coral); font-variant-numeric: tabular-nums; }
.times .l { font-weight: 600; }
.mcard { display: flex; gap: .8em; align-items: center; padding: .7em .9em; animation: rise .45s both; }
.mcard .n { width: 2.6em; height: 2.6em; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--coral-soft); color: var(--coral); font: 800 1.1em var(--font-display); }
.mcard .t { flex: 1; min-width: 0; }
.mcard .t b { display: block; }

/* chalkboard */
.board-wrap { position: relative; container-type: inline-size; width: calc(96% * var(--k)); max-width: 460px; align-self: center; flex: none; }
.board-wrap img { width: 100%; display: block; }
/* the board's inner area in dau_board is x 36-96%, y 17-80%; Đậu's hand and chalk touch its left edge
   (x < 41%), so the chalk starts right of them, one formula per line */
.board-text { position: absolute; left: 42%; top: 22%; width: 51%; height: 53%; display: flex; flex-direction: column; justify-content: center; align-items: center; font: 400 5.2cqw/1.05 var(--font-chalk); color: var(--chalk); text-align: center; white-space: nowrap; }
.board-wrap.big { width: 100%; max-width: 100%; }
.board-text.one { font-size: 9cqw; }
.board-text span { opacity: 0; animation: chalk .5s forwards; }
.board-text span.later, .board-card span.later { animation: none; opacity: 0; }
.board-card { align-self: center; max-width: 100%; background: #2F4A3F; color: var(--chalk); border: 7px solid #B8763A; border-radius: 12px; padding: 12px 18px;
  font: 400 19px/1.35 var(--font-chalk); text-align: center; box-shadow: var(--shadow); }

<script>
(() => {
"use strict";
const L = JSON.parse(document.getElementById("lesson-data").textContent);
const A = JSON.parse(document.getElementById("asset-data").textContent);
const NAME = L.student;
const TEACHER = L.teacher || "anh Khoa";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);

/* ---------- essay index ---------- */
const SENT = {};
L.essay.paragraphs.forEach(p => p.sentences.forEach(s => { SENT[s.id] = s; }));
const C = L.corrections;
const CID_SENT = {};
/* flow 2: the corrections the teacher praised (Khen) and the ones only listed (Danh sách). Lessons made before
   the list existed: every shown vocabulary and grammar item goes to the list */
if (L.flow === 2 && L.language && !L.language.list) {
  const LN0 = L.language, lang = it => it.tab !== "LOGIC";
  LN0.praise = LN0.items.filter(it => lang(it) && it.mode === "praise").map(it => it.ref);
  LN0.list = LN0.items.filter(it => lang(it) && it.mode !== "praise" && it.mode !== "skip").map(it => ({ ref: it.ref, tab: it.tab, ...(it.upgrade ? { upgrade: true } : {}) }));
  LN0.items = LN0.items.filter(it => !lang(it));
}
const PRAISED = new Set([...((L.language || {}).praise || []), ...((L.language || {}).items || []).filter(it => it.mode === "praise").map(it => it.ref)]);   // what the teacher praised
Object.values(SENT).forEach(s => s.segs.forEach(g => { if (typeof g !== "string") CID_SENT[g.c] = s.id; }));
/* counts Đậu says are written as {n} and filled in here, so they stay right when the teacher adds or
   removes an item (finish.extra_prompt keeps its {n}: that one is filled after the practice) */
const fillN = (t, n) => typeof t === "string" ? t.replace(/\{n\}/g, n) : Array.isArray(t) ? t.map(x => fillN(x, n)) : t;
if (L.linking) {
  const K = L.linking, sug = (K.suggestions || []).length;
  K.suggestions_intro = fillN(K.suggestions_intro, sug); K.result = fillN(K.result, sug); K.intro = fillN(K.intro, sug);
}
if (L.mistakes) {
  const M = L.mistakes, size = g => (g.cids || []).length + (g.points || []).length;
  M.main.forEach(m => { m.count_line = fillN(m.count_line, size(m)); });
  const inTab = t => [...M.main.filter(m => m.tab === t), ...M.others.filter(o => o.tag === t)].reduce((n, g) => n + size(g), 0);
  M.lr_intro = fillN(M.lr_intro, inTab("LR")); M.gra_intro = fillN(M.gra_intro, inTab("GRA"));
}
const origText = sid => SENT[sid].segs.map(g => typeof g === "string" ? g : C[g.c].orig).join("").replace(/\s+/g, " ").trim();

/* ---------- DOM helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const img = (key, cls = "", alt = "") => h("img", { src: A[key], class: cls, alt });
/* a section's title card, with the sticker of Đậu that fits it */
const secTitle = (sticker, label, title) => h("div", { class: "card rw-title" }, img(sticker, "rw-icon", ""),
  h("div", {}, label ? h("div", { class: "label" }, label) : null, h("h1", { class: "h" }, title)));
const CITE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const cite = (sid, cids) => h("button", { class: "cite", type: "button", html: CITE_SVG, onclick: () => openEssay({ sid, cids }) }, "Xem trong bài");
const TICK = ok => h("span", { class: "tick" + (ok ? "" : " no"), html: ok ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>' });

/* sentence renderer: "orig" marks focused errors, "diff" shows strike + fix; window trims to N words around them */
function sentence(sid, { mode = "orig", focus = null, live = false, window: win = 0 } = {}) {
  const wrap = h("span", { class: "s", "data-sid": sid });
  for (const g of SENT[sid].segs) {
    if (typeof g === "string") { wrap.append(g); continue; }
    const c = C[g.c];
    const on = !focus || focus.includes(g.c);
    if (mode === "orig") {
      if (on && focus) wrap.append(c.orig ? h("span", { class: "err", "data-c": g.c }, c.orig.trimEnd()) : h("span", { class: "err gap", "data-c": g.c, "aria-label": "chỗ thiếu" }), c.orig.endsWith(" ") ? " " : "");
      else wrap.append(c.orig);
    } else {
      if (!on) { wrap.append(c.orig); continue; }
      const orig = c.orig.trim(), fix = c.fix.trim();
      const lead = /^\s/.test(c.orig || c.fix) ? " " : "", tail = /\s$/.test(c.orig) || /\s$/.test(c.fix) ? " " : "";
      wrap.append(lead, h("span", { class: "corr" + (live ? " live" : ""), "data-c": g.c }, orig ? h("s", {}, orig) : null, orig && fix ? " " : null, fix ? h("ins", {}, fix) : null), tail);
    }
  }
  wrap.normalize();
  if (win && focus) {
    const kids = [...wrap.childNodes];
    const marks = kids.map((n, i) => n.nodeType === 1 ? i : -1).filter(i => i >= 0);
    if (marks.length) {
      const a = marks[0], b = marks[marks.length - 1];
      const first = kids[a - 1], last = kids[b + 1];
      if (first && first.nodeType === 3) { const w = first.data.split(" "); if (w.length > win + 1) first.data = "… " + w.slice(-win - 1).join(" "); }
      if (last && last.nodeType === 3) { const w = last.data.split(" "); if (w.length > win + 1) last.data = w.slice(0, win + 1).join(" ") + " …"; }
    }
  }
  return wrap;
}

/* ---------- confetti ---------- */
function confetti(cols0) {
  if (REDUCED || replay) return;
  const cv = h("canvas", { class: "confetti" }); document.body.append(cv);
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = cols0 || ["#FF9800", "#8DD9B8", "#F9B8AE", "#FFD166", "#6FB7F2"];
  const ps = Array.from({ length: cols0 ? 160 : 90 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .45, vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, hh: 4 + Math.random() * 5, c: cols[Math.random() * cols.length | 0] }));

    on = true; dragged = false; sx = e.clientX; sy = lastY = e.clientY;
  });
  el.addEventListener("pointermove", e => {
    if (!on) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) >= 10) dragged = true;
    // the layer over the page (while Đậu talks) takes no native scroll: pass the drag on
    if (el.id === "catch" && dragged && content) { content.scrollTop -= (e.clientY - lastY) / ZOOM; }
    lastY = e.clientY;
  });
  el.addEventListener("pointerup", e => {
    if (!on) return; on = false;
    if (dragged) return;
    // buttons, inputs and word chips inside the page keep their own taps
    const own = e.target.closest("button, a, input, textarea, label, select, [role=button]");
    if (!tapForward || (own && own !== el && el.contains(own))) return;
    // tapping Đậu himself just sends him aside (to read what he covers); the next tap goes on
    if (tapForward === "hide") { if (mode === "talk" && typed) setMode("away"); else forward(); return; }
    if (scrolls() && !e.target.closest("#say, .say, .hint") && !(el.id === "catch" && overBubble(e))) return;
    forward();
  });
  el.addEventListener("pointercancel", () => { on = false; });
}
/* the catch layer sits over Đậu's bubble: was this tap on the bubble? */
function overBubble(e) {
  const r = sayBox.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}

/* the overall band: the count slows down before the last step (suspense is half the fun), then a
   celebration that grows with the band: 6.0 a pop, 6.5 cheers and gold, 7.0 confetti, 7.5 a star
   stamp, 8.0+ the lights go down, then gold, fireworks and a "Xuất sắc" badge. Played once: going
   back shows the result without the show; reduced motion shows it still. */
async function scoreShow(c, ring, card, to, tier, { step = .5, max = null } = {}) {
  const live = !replay && !REDUCED;
  const steps = [];
  for (let v = step; v < to - 1e-9; v += step) steps.push(v);
  const show = v => { ring.textContent = max ? String(Math.round(v)) : v.toFixed(1); if (max) ring.style.setProperty("--p", Math.min(100, v / max * 100)); };
  let dim = null;
  for (const [i, v] of steps.entries()) {
    show(v);
    const left = steps.length - i;
    if (live && tier >= 5 && left === 2) { dim = h("div", { class: "dimmer" }); document.body.append(dim); requestAnimationFrame(() => dim.classList.add("on")); }
    await c.wait(left > 3 ? 75 : left === 3 ? 170 : left === 2 ? 290 : tier >= 5 ? 1000 : tier >= 3 ? 600 : 420);
  }
  show(to);
  if (dim) { dim.classList.remove("on"); setTimeout(() => dim.remove(), 500); }
  if (tier >= 2) ring.classList.add("gold");
  // the star stamps in behind the ring, its points around it
  const holder = () => { if (ring.parentElement.classList.contains("ring-wrap")) return ring.parentElement; const w = h("div", { class: "ring-wrap" }); ring.replaceWith(w); w.append(ring); return w; };
  const star = () => holder().prepend(h("img", { class: "stamp-star", src: A.icon_star, alt: "" }));
  const badge = () => card.after(h("div", { class: "xs-badge" }, img("icon_trophy"), "Xuất sắc"));
  if (!live) { if (tier >= 4) star(); if (tier >= 5) badge(); fit(); return; }
  const r = () => rectOf(ring), mid = () => ({ x: r().left + r().width / 2, y: r().top + r().height / 2 });
  ring.classList.remove("squash"); void ring.offsetWidth; ring.classList.add("squash");
  if (tier >= 1) burst(ring);
  if (tier >= 2) for (const d of [180, 360]) setTimeout(() => { const m = mid(); burstAt(m.x, m.y, 14, 70 + d / 4); }, d);
  if (tier >= 3) { confetti(tier >= 5 ? ["#FFD166", "#FFB547", "#FFE9A8", "#FF9800", "#FFF3C4", "#F6C453"] : null); app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake"); setTimeout(() => app.classList.remove("shake"), 500); buzz(tier >= 5 ? [40, 60, 40, 60, 120] : 40); }
  if (tier >= 4) { star(); holder().append(h("div", { class: "shock" })); fit(); }
  if (tier >= 5) {
    ring.classList.add("shine");
    const waves = (max ? to / max >= .95 : to >= 8.5) ? 2 : 1;
    for (let w = 0; w < waves; w++) for (let k = 0; k < 5; k++) setTimeout(() => burstAt(innerWidth * (.15 + Math.random() * .7), innerHeight * (.12 + Math.random() * .45), 22, 90), 250 + w * 900 + k * 170);
    await c.wait(500);
    badge(); fit();
  }
  await c.wait(tier >= 3 ? 700 : 350);
}

/* one mistake group: her sentences, a question, the fixes, then the rule. Flow 2 (pos = { k, back }): the
   k-th systematic mistake, opened with one line that counts its places; each fix gets a tag for the
   pattern it follows, and the board has one line per pattern */
function addMistake(m, optional, lead = [], pos = null) {
  const sids = [...new Set(m.cids.map(x => CID_SENT[x]))];
  const opts = { group: "m-" + m.id, optional };
  const head = label => h("div", { class: "row" }, h("button", { class: "backchip", type: "button", onclick: () => jump(pos && pos.back >= 0 ? pos.back : tabIdx[m.tab]) }, "‹ Tất cả lỗi"), h("span", { class: "pill " + (label === "Quy tắc" ? "tone-orange" : "tone-blush") }, label));
  mistakeIdx[m.id] = screens.length;
  add(m.tab, async c => {
    c.show(head(V2 ? "Lỗi hệ thống" : m.tab === "LR" && optional ? "Từ vựng" : optional ? "Lỗi phụ" : "Lỗi quan trọng nhất"));
    for (const line of lead.filter(Boolean)) { await c.say(line, "explaining"); await c.gate(); }
    const spots = [...sids.map(sid => ({ sid })), ...ptsOf(m).map(p => ({ p, sid: p.sids[0] }))];
    // flow 2: one opening line, said with the first sentence already on screen
    const opening = !pos ? `Em để ý ${spots.length} câu này nè ${NAME}`
      : pos.k ? `Lỗi ${ORDINAL[pos.k] || "tiếp theo"} em hay lặp lại là ${m.title} nè, em để ý ${mCount(m)} chỗ này nha`
      : `Giờ mình xem lỗi em hay lặp lại nhất nha, em để ý ${mCount(m)} chỗ này nè`;
    if (!pos) await c.say(opening, "magnify");
    const cards = [], snips = h("div", { class: "stack" });
    for (const [i, spot] of spots.entries()) {
      if (i) await c.gate();
      const body = h("div", { class: "quote en" }, spot.p ? markFocus(spot.p.sids.map(origText).join(" "), spot.p.quote) : sentence(spot.sid, { mode: "orig", focus: m.cids, window: 5 }));
      const col = h("div", { class: "snip-col" }, body);
      const card = h("button", { class: "card snip", type: "button", "aria-label": "Xem câu này trong bài", onclick: () => openEssay({ sid: spot.sid, cids: m.cids }) }, col, h("span", { class: "pin", html: CITE_SVG }));
      card.body = body; card.col = col; card.sid = spot.sid; card.p = spot.p; cards.push(card);
      if (i) { card.classList.add("rise"); snips.append(card); } else { snips.append(card); c.show(snips); }
      if (!i && pos) await c.say(opening, "magnify");
    }
    await c.gate();
    if (m.ask.q && (m.ask.options || []).length > 1) {
      await c.say(m.ask.q, "thinking");
      const i = await c.ask(m.ask.options, { answer: m.ask.answer, key: "m-" + m.id, q: m.ask.q });
      await c.say(i === m.ask.answer ? "Đúng rồi á em" : `Chưa đúng nè ${NAME}, đáp án đúng là câu tô xanh á`, i === m.ask.answer ? "thumbsup" : "oops");
      await c.gate();
      content.querySelector(".ask")?.remove(); fit();
    }
    if (!pos) await c.say(m.count_line, "explaining");
    for (const card of cards) {
      // a correction shows the fix in place; a note gets the teacher's comment and a better version under it
      if (card.p) card.col.append(...[card.p.comment ? h("div", { class: "pt-comment" }, h("b", {}, TEACHER + ": "), card.p.comment) : null,
        card.p.better ? h("div", { class: "pt-better" }, h("span", { class: "lbl" }, "Viết lại"), h("span", { class: "en" }, card.p.better)) : null].filter(Boolean));
      else card.body.replaceChildren(sentence(card.sid, { mode: "diff", focus: m.cids, live: !replay, window: 5 }));
      fit(); await c.wait(500);
    }
    // flow 2: each fix tagged with the pattern it follows (the board's lines)
    const pats = m.patterns || [];
    if (pos && pats.length) {
      await c.wait(300);
      for (const card of cards) {
        const refs = card.p ? [card.p.nid] : m.cids.filter(x => CID_SENT[x] === card.sid);
        const ks = [...new Set(refs.map(r => pats.findIndex(x => x.refs.includes(r))).filter(x => x >= 0))];
        if (ks.length) { card.col.append(h("div", { class: "ptags" }, ks.map(x => h("span", { class: "ptag p" + (x % 4) }, pats[x].formula)))); fit(); await c.wait(250); }
      }
    }
    await c.wait(300);
    if (pos) {
      // the number big, the line said by Đậu
      const times = c.show(h("div", { class: "card times" }, h("div", { class: "n" }, mCount(m)), h("div", { class: "l" }, "lần trong bài")));
      await c.say(m.count_line, "explaining", { spot: times });
    } else c.show(h("div", { class: "card times" }, h("div", { class: "n" }, mCount(m)), h("div", { class: "l" }, m.count_line)));
    await c.gate();
    await c.say(m.reason, "thinking");
  }, opts);
  add(m.tab, async c => {
    c.show(head("Quy tắc"));
    c.show(h("h2", { class: "h2" }, m.title));
    await chalkBoard(c, boardOf(m), { dots: (m.patterns || []).length > 1 });
    const ul = h("ul", { class: "rules" });
    c.show(h("div", { class: "card" }, ul));
    // with patterns: one rule per board line, in the board line's colour
    const pats = (m.patterns || []).filter(x => x.rule);
    const rules = pats.length ? pats.map((x, k) => h("li", { class: "p" + ((m.patterns.indexOf(x)) % 4) }, h("div", {}, h("span", { class: "pf en" }, x.formula), x.rule)))
      : m.rule.map(r => h("li", {}, r));
    for (const [i, li] of rules.entries()) { if (i) await c.gate(); else await c.wait(700); ul.append(li); fit(); }
    await c.gate();
    c.show(h("div", { class: "card stack" },
      h("div", { class: "ex-line" }, img("icon_cross", "icon"), h("span", {}, m.example.bad)),
      h("div", { class: "ex-line" }, img("icon_check", "icon"), h("span", {}, m.example.good))));
  }, opts);
}

// ---------------- flow 2 · Language: what she used well, the systematic mistake, then each correction ----------------
/* the corrections and notes the teacher kept, as screens ("units"): one correction or note; Dạy corrections
   in the same sentence together; a group the teacher made ("Gộp với…") together. In essay order. */
function langUnits() {
  const LN = L.language || { items: [], groups: [] }, units = [], byGroup = {};
  const groups = Object.fromEntries((LN.groups || []).map(g => [g.id, g]));
  for (const it of LN.items) {
    const isC = it.ref[0] === "c", note = isC ? null : L.task_comments[+it.ref.slice(1) - 1];
    if (isC ? !C[it.ref] : !note) continue;
    const sid = isC ? CID_SENT[it.ref] : (note.sentence_ids || [])[0];
    const spot = { ref: it.ref, sid, isC, note, swap: it.swap || null, upgrade: !!it.upgrade };
    const g = it.group && groups[it.group];
    if (g) {
      if (byGroup[g.id]) { byGroup[g.id].spots.push(spot); continue; }
      units.push(byGroup[g.id] = { tab: it.tab, mode: it.mode, sid, spots: [spot], ask: g.ask || it.ask || null, board: g.board || it.board || null, group: g, key: "g-" + g.id });
      continue;
    }
    const last = units[units.length - 1];
    if (isC && it.mode === "teach" && last && last.teachC && last.sid === sid && last.tab === it.tab) { last.spots.push(spot); continue; }
    units.push({ tab: it.tab, mode: it.mode, sid, spots: [spot], ask: it.ask || null, board: it.board || null, teachC: isC && it.mode === "teach", key: "li-" + it.ref });
  }
  return units;
}
/* a typed-in addition (a linker, a missing word) as it reads in her sentence */
function typedWords(note) {
  const t = (note.added || "").trim();
  if (!t || /^(=>|\/\/|\)\))/.test(t) || note.quote) return "";
  return t.replace(/\p{Lu}{2,}/gu, w => ["UK", "US", "USA", "EU", "GDP", "IELTS", "TV", "IT", "AI"].includes(w) ? w : w.toLowerCase()).replace(/\bi\b/g, "I");
}
const isLinker = note => typedWords(note) && !(note.at > 0);
/* one card of a unit, before (her words, what is asked about underlined) or after (the fixes, drawn in one
   after another from delay d when live). v.refs: the corrections shown in one sentence; v.sp: a note */
function spotView(v, { after, live, focus, d = 0, praise = false }) {
  if (v.refs) {
    const el = sentence(v.sid, { mode: after ? "diff" : "orig", focus: v.refs, live, window: v.refs.length > 1 ? 0 : 8 });
    el.querySelectorAll(".corr.live").forEach((x, k) => x.style.setProperty("--d", d + k * .9 + "s"));
    // a "nâng cấp": her words stay, not struck through
    el.querySelectorAll("[data-c]").forEach(x => { if ((v.up || []).includes(x.dataset.c)) x.classList.add("up"); });
    return [el];
  }
  const sp = v.sp, text = (sp.note.sentence_ids || []).map(origText).join(" "), add = typedWords(sp.note);
  if (add) {
    // the words the teacher typed in, popping in where she typed them (a linker: the sentence before, faded)
    let at = Math.max(0, Math.min(text.length, sp.note.at > 0 ? sp.note.at : 0));
    if (at && at < text.length && !/\s/.test(text[at - 1])) { const k = text.lastIndexOf(" ", at); at = k < 0 ? 0 : k + 1; }
    const start = at === 0, words = start ? add.charAt(0).toUpperCase() + add.slice(1) : add;
    let rest = text.slice(at);
    if (start && after && /^\p{Lu}(\p{Ll}|\s)/u.test(rest) && !/^I\b/.test(rest)) rest = rest.charAt(0).toLowerCase() + rest.slice(1);
    const order = Object.keys(SENT), prev = start ? order[order.indexOf(sp.sid) - 1] : null;
    const ins = after ? h("span", { class: "corr" + (live ? " live" : ""), style: `--d:${d}s` }, h("ins", {}, words)) : h("span", { class: "err gap", "aria-label": "chỗ thiếu" });
    return [prev && SENT[prev] ? h("span", { class: "prev-ctx" }, "… " + origText(prev).split(" ").slice(-8).join(" ") + " ") : null, text.slice(0, at), ins, " ", rest].filter(x => x !== null);
  }
  const sw = sp.swap, from = sw ? sw.from : focus || sp.note.quote, up = sp.upgrade ? " up" : "";
  const i = from ? text.indexOf(from) : -1;
  if (praise) return i < 0 ? [text] : [text.slice(0, i), h("mark", { class: "good" }, from), text.slice(i + from.length)];
  if (i < 0) return markFocus(text, focus || sp.note.quote);
  if (!after || !sw) return [text.slice(0, i), h("span", { class: "err" + up }, from), text.slice(i + from.length)];
  return [text.slice(0, i), h("span", { class: "corr" + up + (live ? " live" : ""), style: `--d:${d}s` }, h("s", {}, sw.from), " ", h("ins", {}, sw.to)), text.slice(i + sw.from.length)];
}
/* one unit's screen: the sentence(s); Socratic asks first; then the fixes draw in one after another and the
   teacher's comments rise under them */

/* sentence builder: tap to add or remove a word, drag it to put it anywhere */
function builder(item, isDone) {
  const words = [...item.answer, ...item.extra];
  const order = words.map((_, i) => i).sort((a, b) => ((a * 7919 + words.length * 31) % 97) - ((b * 7919 + words.length * 31) % 97));
  const line = h("div", { class: "build-line", "aria-label": "Câu của em" });
  const pool = h("div", { class: "pool" });
  const chips = order.map((i, rank) => { const ch = h("button", { class: "wchip", type: "button", "data-i": i }, words[i]); ch.rank = rank; return ch; });
  pool.append(...chips);
  const toPool = ch => { const after = [...pool.children].find(x => x.rank > ch.rank); pool.insertBefore(ch, after || null); };
  const toggle = ch => { if (ch.parentNode === pool) line.append(ch); else toPool(ch); line.classList.remove("bad", "ok"); fit(); };
  let drag = null;
  const before = (x, y) => {
    const kids = [...line.children].filter(n => n.classList.contains("wchip") && n !== drag.ch);
    for (const kid of kids) { const r = rectOf(kid); if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) return kid; }
    return null;
  };
  const overLine = (x, y) => { const r = rectOf(line); return x > r.left - 20 && x < r.right + 20 && y > r.top - 30 && y < r.bottom + 30; };
  chips.forEach(ch => {
    ch.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !isDone()) { e.preventDefault(); toggle(ch); } });
    ch.addEventListener("pointerdown", e => {
      if (isDone()) return;
      e.preventDefault(); ch.setPointerCapture(e.pointerId);
      drag = { ch, x: e.clientX, y: e.clientY, moved: false, ghost: null, ph: h("span", { class: "ph" }) };
    });
    ch.addEventListener("pointermove", e => {
      if (!drag || drag.ch !== ch) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      if (!drag.moved) { drag.moved = true; drag.ghost = h("div", { class: "wchip ghost" }, ch.textContent); document.body.append(drag.ghost); ch.classList.add("dragging"); }
      const x = e.clientX / ZOOM, y = e.clientY / ZOOM;  // pointer in page units
      drag.ghost.style.left = x + "px"; drag.ghost.style.top = y + "px";
      if (overLine(x, y)) line.insertBefore(drag.ph, before(x, y)); else drag.ph.remove();
    });
    const finish = () => {
      if (!drag || drag.ch !== ch) return;
      const d = drag; drag = null;
      if (!d.moved) return toggle(ch);
      ch.classList.remove("dragging"); d.ghost.remove();
      if (d.ph.parentNode) { line.insertBefore(ch, d.ph); d.ph.remove(); } else toPool(ch);
      line.classList.remove("bad", "ok"); fit();
    };
    ch.addEventListener("pointerup", finish);
    ch.addEventListener("pointercancel", finish);
  });
  return {
    el: h("div", { class: "stack" }, line, pool), line,
    picked: () => [...line.querySelectorAll(".wchip")].map(x => words[+x.dataset.i]),
    showAnswer: () => { line.replaceChildren(...item.answer.map(w => h("span", { class: "wchip" }, w))); line.classList.remove("bad"); line.classList.add("ok"); pool.remove(); fit(); },
  };

function copyText(text, note) {
  const done = () => { note.textContent = text ? "Chép rồi nè, giờ em dán vào Zalo nha" : "Em chưa viết gì hết á"; };
  if (!text) return done();
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(done, fallback);
  fallback();
  function fallback() {
    const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); } catch (e) { /* the text is still in the box to copy by hand */ }
    t.remove(); done();
  }
}

/* ---------- Sổ tay: one picture to keep (good phrases, mistakes to watch out for) ---------- */
/* what goes in it, from the lesson itself */
function notebookData() {
  const good = [];                                   // [group label, [phrases]]
  const P = (L.language && L.language.phrases) || (L.linking && L.linking.groups ? { groups: L.linking.groups } : null);
  for (const g of (P && P.groups) || []) if (g.items.length) good.push([g.label, g.items.map(x => x.text)]);
  const praised = [...PRAISED].map(r => r[0] === "c" ? (C[r] ? (C[r].fix || C[r].orig).trim() : "") : (L.task_comments[+r.slice(1) - 1] || {}).quote).filter(Boolean);
  if (praised.length) good.push([TEACHER + " khen", praised]);
  // her words around a correction, a few on each side
  const around = cid => {
    const sid = CID_SENT[cid]; if (!sid) return { pre: "", post: "" };
    const segs = SENT[sid].segs, j = segs.findIndex(g => typeof g !== "string" && g.c === cid);
    const txt = gs => gs.map(g => typeof g === "string" ? g : C[g.c].orig).join("");
    const pw = txt(segs.slice(0, j)).trim().split(/\s+/).filter(Boolean), qw = txt(segs.slice(j + 1)).trim().split(/\s+/).filter(Boolean);
    return { pre: (pw.length > 4 ? "… " : "") + pw.slice(-4).join(" "), post: qw.slice(0, 4).join(" ") + (qw.length > 4 ? " …" : "") };
  };
  const fromC = (cid, up) => ({ ...around(cid), from: C[cid].orig.trim(), to: C[cid].fix.trim(), note: C[cid].comment || "", up });
  const fromNote = (ref, it = {}) => {
    const t = L.task_comments[+ref.slice(1) - 1]; if (!t) return null;
    const add = typedWords(t);
    if (it.swap) return { pre: "", post: "", from: it.swap.from, to: it.swap.to, note: t.comment, up: !!it.upgrade };
    if (add) return { pre: "", post: "", from: "", to: add, note: t.comment, up: false };
    return t.quote ? { pre: "", post: "", from: t.quote, to: "", note: t.comment, up: !!it.upgrade, keep: true } : null;
  };
  const sys = [], mistakes = [];
  const M = L.mistakes || { main: [], others: [] };
  for (const m of M.main || []) sys.push({ title: m.title, board: boardOf(m), dots: (m.patterns || []).length > 1, rule: (m.patterns || []).length ? m.patterns.map(x => x.rule).filter(Boolean) : m.rule || [], items: [...m.cids.filter(c => C[c]).map(c => fromC(c, false)), ...(m.points || []).map(p => fromNote(p.nid)).filter(Boolean)] });
  // only the main things: the list of other fixes (Danh sách) stays on the page
  const take = ((L.finish && L.finish.takeaways) || []).filter(t => t && t.trim());
  return { good, take, sys, mistakes };
}

/* Đậu pointing at the chalkboard, the formulas written on it one line at a time. All lines are laid out
   first (invisible) so the chalk can be sized to fit the board; a plain board if they're too long */
async function chalkBoard(c, board, { dots = false } = {}) {
  // dots: each line marked with its pattern's colour, as on the tags under her sentences
  const lines = board.map((line, k) => h("span", { class: "later" }, dots ? h("i", { class: "pdot p" + (k % 4), "aria-hidden": "true" }) : null, line));
  const text = h("div", { class: "board-text" + (board.length === 1 ? " one" : ""), "aria-label": board.join(", ") }, lines);
  const pic = img("dau_board", "", "anh Đậu chỉ lên bảng");
  const wrap = c.show(h("div", { class: "board-wrap" }, pic, text));
  if (!(await fitBoard(wrap, text, pic))) {
    wrap.replaceWith(h("div", { class: "board-card", "aria-label": board.join(", ") }, lines)); fit();
  }
  for (const [i, line] of lines.entries()) { await c.wait(i ? 450 : 600); line.classList.remove("later"); }
}

/* the chalk on the drawn board: shrink until every line fits, never below 12px (readable on a phone);
   if that's not enough, make the picture full width and try again; false = use a plain board */
async function fitBoard(wrap, text, pic) {
  const settle = p => Promise.race([p, new Promise(r => setTimeout(r, 1500))]);
  if (!pic.complete) await settle(new Promise(r => { pic.onload = pic.onerror = r; }));
  if (document.fonts && document.fonts.ready) await settle(document.fonts.ready);
  const over = () => text.scrollWidth > text.clientWidth + 1 || text.scrollHeight > text.clientHeight + 1;
  const tryFit = () => {
    const minK = 12 / (wrap.clientWidth || 1) * 100;               // cqw: % of the board picture's width
    let k = text.classList.contains("one") ? 9 : 7;
    text.style.fontSize = k + "cqw";
    while (over() && k - 0.2 >= minK) { k -= 0.2; text.style.fontSize = k + "cqw"; }
    return !over();
  };
  if (tryFit()) return true;
  wrap.classList.add("big"); fit();
  if (tryFit()) return true;
  wrap.classList.remove("big");
  return false;
}

function sheet(title, head, body) {

    body);

  const esc = e => { if (e.key === "Escape") close(); };

/* wrap the words `quote` (her original text, so corrections' new words are skipped) in a tappable
   highlight; a note over whole sentences marks them whole */
function markIn(root, quote, onTap) {
  const nodes = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) if (!n.parentElement.closest("ins")) nodes.push(n);
  const full = nodes.map(n => n.data).join(""), q = quote.replace(/\s+/g, " ").trim(), flat = full.replace(/\s+/g, " ");
  let a = flat.indexOf(q), b = a + q.length;
  if (a < 0) { if (flat.trim() && q.includes(flat.trim())) { a = flat.indexOf(flat.trim()); b = a + flat.trim().length; } else return []; }
  // positions in the whitespace-collapsed text -> positions in the real text
  const map = []; let prevSpace = false;
  for (let i = 0; i < full.length; i++) { const sp = /\s/.test(full[i]); if (!(sp && prevSpace)) map.push(i); prevSpace = sp; }
  const A = map[a], B = b < map.length ? map[b] : full.length;
  const marks = [];
  let pos = 0;
  for (const n of nodes) {
    const s0 = pos, s1 = pos + n.data.length; pos = s1;
    const x = Math.max(A, s0), y = Math.min(B, s1);
    if (x >= y || n.parentElement.closest(".corr")) continue;    // a correction keeps its own tap
    let mid = n;
    if (x > s0) mid = mid.splitText(x - s0);
    if (y < s1) mid.splitText(y - x);
    const mark = h("span", { class: "tr-hl" });
    mid.replaceWith(mark); mark.append(mid);
    mark.addEventListener("click", e => { e.stopPropagation(); onTap(mark); });
    marks.push(mark);
  }
  return marks;
}

  const sheetEl = sheet("Bài của " + NAME, h("div", { class: "seg-row" }, h("div", { class: "seg" }, segBtns), startBtn), body);
  sheetEl.append(stepper);
  if (step) requestAnimationFrame(() => go(0));
  if (sid) requestAnimationFrame(() => { const t = body.querySelector(".s.hl"); if (t) t.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" }); });
}

// the editor's preview can open straight at a section (and skip a few screens into it)

const startAt = byName >= 0 ? byName : L.__start ? screens.findIndex(sc => sc.sec === L.__start) : 0;
run(startAt < 0 ? 0 : Math.min(screens.length - 1, startAt + (byName >= 0 ? 0 : L.__startOffset || 0)));

})();
